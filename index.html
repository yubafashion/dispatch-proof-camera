<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DISPATCH PROOF MANAGEMENT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#e9edf2;color:#202124}
body{padding:8px;overflow:auto}.app{width:min(980px,100%);min-height:calc(100vh - 16px);margin:auto;background:#f4f6f8;border:1px solid #cfd5dc;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden}
.top{background:#fff;padding:8px 10px;border-bottom:1px solid #d9dee5;text-align:center}.title{font-size:18px;font-weight:800;line-height:1.1}.ag{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#5f6368;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #d9dee5}.tab{flex:1;text-align:center;padding:9px 5px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:#202124;color:#fff}
.tools{display:flex;gap:6px;align-items:center;background:#fff;padding:6px 8px;border-bottom:1px solid #d9dee5}.tools b{font-size:10px}select{height:34px;min-width:150px;max-width:220px;border:1px solid #aeb7c4;border-radius:7px;padding:0 6px;background:#fff}
.status{font-size:10px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scan{display:flex;gap:6px;background:#fff;padding:7px 8px;border-bottom:1px solid #d9dee5}
#awb{flex:1;min-width:0;height:40px;border:1px solid #aeb7c4;border-radius:7px;padding:0 10px;font-size:16px;outline:none}button{height:36px;border:0;border-radius:7px;padding:0 10px;font-weight:800;cursor:pointer}
.primary{background:#1a73e8;color:#fff}.green{background:#188038;color:#fff}.orange{background:#f9ab00;color:#111}.gray{background:#e8eaed;color:#202124}.red{background:#d93025;color:#fff}
.main{padding:7px;overflow:auto}.notice{display:none;background:#fff8e1;border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:11px}.notice.error{background:#fde7e9;color:#b3261e}.notice.ok{background:#e6f4ea;color:#137333}.notice.terminal{font-size:14px;font-weight:800;text-align:center}
.info{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:11px}.card{display:none;background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:10px;margin-bottom:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.label{font-size:9px;color:#6b7280}.value{font-weight:700;font-size:12px}.ready{color:#188038;font-weight:800}.required{color:#d93025;font-weight:800}
.cameraPanel{display:none;background:#111;border-radius:9px;padding:8px;margin-bottom:7px;color:#fff}.cameraHead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;margin-bottom:6px}.live{color:#ff7777;font-weight:900}.timer{font-size:17px;font-weight:900;margin-left:6px}
.cameraFrame{display:block;width:100%;max-height:430px;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:7px}.cameraControls{display:flex;justify-content:flex-end;margin-top:7px}.videoBox{background:#111;border-radius:8px;padding:8px;margin-top:8px;color:#fff}
.proofVideo{display:block;width:100%;max-height:360px;background:#000;border-radius:6px}.controls{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:#6b7280;background:#fff;border:1px solid #dfe3e8;border-radius:8px}.small{font-size:10px;height:30px;padding:0 8px}
#uploadFrame{display:none}@media(max-width:600px){body{padding:0}.app{width:100%;min-height:100vh;border-radius:0;border:0}.tools{flex-wrap:wrap}.tools select{flex:1;min-width:130px}.grid{grid-template-columns:1fr}.cameraFrame{max-height:300px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="title">DISPATCH PROOF MANAGEMENT</div><div class="ag">V64 DIRECT JSONP DRIVE</div></div>
<div class="tabs"><div id="tabDispatch" class="tab active">🎥 MAKE DISPATCH VIDEO</div><div id="tabProof" class="tab">🎥 VIDEO PROOF</div></div>
<div class="tools"><b>CAMERA</b><select id="cameraSelect"><option value="">Camera</option></select><button id="refreshCamera" class="gray">REFRESH CAMERA</button><button id="testCamera" class="primary">TEST CAMERA</button><span id="cameraState" class="status">Camera not started</span></div>
<div class="scan"><input id="awb" autofocus autocomplete="off" placeholder="SCAN AWB BARCODE..."><button id="scanBtn" class="primary">SCAN</button><button id="refreshBtn" class="gray">REFRESH</button></div>
<div class="main">
<div id="notice" class="notice"></div>
<div id="info" class="info">Dispatch: scan AWB → order details → recording starts automatically. Scan next AWB to save the previous video and continue.</div>
<div id="cameraPanel" class="cameraPanel"><div class="cameraHead"><span id="cameraLabel">CAMERA READY</span><span><span id="live" class="live" style="display:none">● RECORDING</span><span id="timer" class="timer">00:00</span></span></div><video id="cameraFrame" class="cameraFrame" autoplay muted playsinline></video><div class="cameraControls"><button id="stopBtn" class="red">■ STOP &amp; SAVE</button></div></div>
<div id="result" class="card"></div><div id="empty" class="empty">SCAN AWB TO LOAD ONLY THAT ORDER</div>
</div></div>
<iframe id="uploadFrame" name="DP64_UPLOAD_FRAME"></iframe>
<script>
'use strict';
function normalizeApiUrl(raw){const s=String(raw||'').trim();if(!s)return '';const m=s.match(/^(https:\/\/script\.google\.com\/(?:macros|a\/macros\/[^/]+)\/s\/[^/?#]+\/(?:exec|dev))/i);return m?m[1]:((/^https:\/\/script\.google\.com\/macros\/s\//i.test(s))?s.split('#')[0].split('?')[0].replace(/\/+$/,''):'')}
const params=new URLSearchParams(location.search),API_URL=normalizeApiUrl(params.get('api')||localStorage.getItem('DP64_API_URL')||'');
if(API_URL)localStorage.setItem('DP64_API_URL',API_URL);else localStorage.removeItem('DP64_API_URL');
let mode='DISPATCH',stream=null,recorder=null,chunks=[],currentSession=null,nextOrder=null,timerHandle=null,recordStartedAt=0,cameraReady=false,selectedCameraId=localStorage.getItem('DP64_CAMERA_ID')||'',uploadQueue=0,lastSaved=null;
const $=id=>document.getElementById(id);
function note(text,kind=''){const e=$('notice');e.textContent=text||'';e.className='notice '+kind;e.style.display=text?'block':'none'}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function js(v){return JSON.stringify(String(v==null?'':v))}
function clearResult(){$('result').style.display='none';$('result').innerHTML='';$('empty').style.display='block'}

function apiJsonp(action,data,callback,timeoutMs=20000){
  if(!API_URL){callback({ok:false,found:false,message:'Backend URL is missing. Open from Google Sheet → DISPATCH CAMERA → Open camera.'});return}
  const cb='DP64_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script');let done=false;
  const timer=setTimeout(()=>finish({ok:false,found:false,message:'Backend response timeout. Check the SAME Web App deployment: Execute as Me + Anyone.'}),timeoutMs);
  function finish(r){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();callback(r||{ok:false,found:false,message:'Empty backend response'})}
  window[cb]=finish;s.onerror=()=>finish({ok:false,found:false,message:'Web App could not be reached. Verify deployment access.'});
  const q=new URLSearchParams();q.set('dpAction',action);q.set('callback',cb);q.set('_ts',Date.now());Object.keys(data||{}).forEach(k=>q.set(k,data[k]==null?'':String(data[k])));
  s.src=API_URL+'?'+q.toString();document.head.appendChild(s);
}

async function refreshCameras(){
  try{if(!navigator.mediaDevices?.enumerateDevices){note('Camera API is unavailable in this browser.','error');return}
  const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),sel=$('cameraSelect');sel.innerHTML='';
  if(!cams.length){sel.innerHTML='<option value="">No camera detected</option>';$('cameraState').textContent='No camera found';return}
  cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;o.textContent=c.label||('Camera '+(i+1));sel.appendChild(o)});
  if(selectedCameraId&&cams.some(c=>c.deviceId===selectedCameraId))sel.value=selectedCameraId;else{selectedCameraId=cams[0].deviceId;sel.value=selectedCameraId;localStorage.setItem('DP64_CAMERA_ID',selectedCameraId)}
  $('cameraState').textContent=cams.length+' camera(s) available'}catch(e){note('Unable to list cameras: '+(e.message||e),'error')}
}
async function startCamera(){
  if(!window.isSecureContext)throw new Error('Camera requires HTTPS. Open the published GitHub Pages URL.');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera API is unavailable.');
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const id=$('cameraSelect').value||selectedCameraId,vc=id?{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720}}:{width:{ideal:1280},height:{ideal:720},facingMode:{ideal:'environment'}};
  stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:true});$('cameraFrame').srcObject=stream;$('cameraPanel').style.display='block';cameraReady=true;$('cameraState').textContent='Camera ready ✓';await refreshCameras();
}
function cameraError(e){const n=e&&e.name||'';if(n==='NotAllowedError'||n==='PermissionDeniedError')return 'Camera permission denied. Allow camera + microphone, then TEST CAMERA again.';if(n==='NotFoundError')return 'No camera was found.';if(n==='NotReadableError')return 'Camera is busy. Close other camera apps.';if(n==='OverconstrainedError')return 'Selected camera cannot use these settings. Choose another camera.';return e?.message||'Unable to access camera.'}
async function testCamera(){try{await startCamera();note('Camera ready ✓. Scan AWB to start recording.','ok')}catch(e){note(cameraError(e),'error')}}

const SHEET_ID='1E5VW0AjcECVcuVFx9geaCHfhbMtefA_ZUC8FB9kxqDs';
function gvizJsonp(sheetName){
  const cb='DP64G_'+Date.now()+'_'+Math.floor(Math.random()*100000),url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent(sheetName)+'&headers=1&tqx='+encodeURIComponent('out:json;responseHandler:'+cb)+'&_ts='+Date.now();
  return new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('Sheet lookup timed out')),12000);function finish(v){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();v instanceof Error?reject(v):resolve(v)}window[cb]=d=>finish(d);s.onerror=()=>finish(new Error('Sheet lookup failed'));s.src=url;document.head.appendChild(s)})
}
function parseGviz(data){if(!data?.table)return [];const cols=(data.table.cols||[]).map(c=>String(c.label||c.id||'').trim().toLowerCase());return (data.table.rows||[]).map(row=>{const o={};(row.c||[]).forEach((cell,i)=>o[cols[i]||('c'+i)]=cell?(cell.f!=null&&String(cell.f)!==''?String(cell.f):(cell.v==null?'':String(cell.v))):'');return o})}
function normalizeAwb(v){return String(v==null?'':v).replace(/[^\w]/g,'').toUpperCase()}
function pickOrderRow(rows,awb){const n=normalizeAwb(awb);for(let i=rows.length-1;i>=0;i--){const r=rows[i],v=r['awb number']||r.awb||r['awb no']||r['awb no.']||'';if(normalizeAwb(v)===n)return r}return null}
function rowToScanResult(r,awb,nextMode){const status=r['live delivery status']||r.status||'',delivered=/^(delivered|successful|success|closed)$/i.test(String(status).trim());return{ok:true,found:true,date:r.date||'',orderId:r['order number']||r['order id']||r.order||'',awb:r['awb number']||r.awb||awb,dispatchType:r['dispatch type']||'',status,sku:r['itam sku']||r.itam||r.sku||'',store:r.store||'',videoType:nextMode==='PROOF'?'RETURN':'DISPATCH',terminal:nextMode!=='PROOF'&&delivered}}
async function lookupAwb(awb,nextMode){let row=pickOrderRow(parseGviz(await gvizJsonp('Order')),awb);if(!row)row=pickOrderRow(parseGviz(await gvizJsonp('Closed')),awb);if(!row)return{found:false,message:'AWB not found: '+awb};return rowToScanResult(row,awb,nextMode)}

function setMode(next){if(recorder?.state==='recording'){note('Recording active. Scan next AWB or press STOP & SAVE.','error');return}mode=next;$('tabDispatch').classList.toggle('active',mode==='DISPATCH');$('tabProof').classList.toggle('active',mode==='PROOF');$('info').textContent=mode==='DISPATCH'?'Dispatch: scan AWB → order details → recording starts automatically. Scan next AWB to save the previous video and continue.':'Proof: scan AWB → existing Dispatch Video is shown. If a problem status exists, Make Return Video is available.';clearResult();$('awb').focus()}
function scan(){const v=$('awb').value.trim();if(!v){note('Please scan AWB.','error');return}note('Looking up AWB in the Order sheet…','ok');lookupAwb(v,mode).then(r=>{if(r.found){handleScan(r);return}apiJsonp('SCAN',{awb:v,mode},handleScan,25000)}).catch(()=>apiJsonp('SCAN',{awb:v,mode},handleScan,25000))}
function handleScan(r){if(!r?.found){note(r?.message||'AWB not found.','error');return}if(r.terminal){clearResult();$('empty').style.display='none';note('This Order ID is already delivered successfully. No video proof is required.','terminal');$('awb').value='';$('awb').focus();return}if(mode==='DISPATCH'){if(recorder?.state==='recording'){nextOrder=r;stopRecording();return}showDispatch(r);startRecording(r);return}showProof(r)}
function showDispatch(r){$('empty').style.display='none';$('result').innerHTML='<div class="grid"><div><div class="label">DATE</div><div class="value">'+esc(r.date)+'</div></div><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">DISPATCH TYPE</div><div class="value">'+esc(r.dispatchType)+'</div></div></div><div style="margin-top:8px" class="ready">● RECORDING STARTS AUTOMATICALLY AFTER AWB VERIFICATION</div>';$('result').style.display='block'}
function mergeVideos(r,done){let left=2,dispatch=null,ret=null;function one(type,cb){apiJsonp('GET_RECORD',{awb:r.awb,videoType:type},x=>{cb(x?.found?x:null);if(--left===0)done(dispatch,ret)},15000)}one('DISPATCH',x=>dispatch=x);one('RETURN',x=>ret=x)}
function showProof(r){$('empty').style.display='none';mergeVideos(r,(dv,rv)=>{r.dispatchVideo=dv;r.returnVideo=rv;let html='<div class="grid"><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">LIVE STATUS</div><div class="value">'+esc(r.status||'')+'</div></div><div><div class="label">DISPATCH VIDEO</div><div class="value '+(dv?'ready':'required')+'">'+(dv?'VIDEO READY':'NOT AVAILABLE')+'</div></div></div>';if(dv)html+='<div class="videoBox"><div style="font-weight:800;margin-bottom:6px">DISPATCH VIDEO</div><video class="proofVideo" controls playsinline src="'+esc(dv.downloadUrl)+'"></video><div class="controls"><button class="primary small" onclick="downloadFile('+js(dv.fileId)+')">⬇ DOWNLOAD</button><button class="green small" onclick="shareFile('+js(dv.fileId)+')">↗ SHARE</button></div></div>';if(rv)html+='<div class="videoBox"><div style="font-weight:800;margin-bottom:6px">RETURN VIDEO • READY</div><video class="proofVideo" controls playsinline src="'+esc(rv.downloadUrl)+'"></video><div class="controls"><button class="primary small" onclick="downloadFile('+js(rv.fileId)+')">⬇ DOWNLOAD</button><button class="green small" onclick="shareFile('+js(rv.fileId)+')">↗ SHARE</button></div></div>';else html+='<div style="margin-top:9px"><span class="required">RETURN VIDEO REQUIRED</span> <button class="orange" onclick="startReturnRecording('+js(r.awb)+','+js(r.orderId)+','+js(r.status)+')">MAKE RETURN VIDEO</button></div>';$('result').innerHTML=html;$('result').style.display='block'})}
function chooseMime(){for(const t of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(window.MediaRecorder?.isTypeSupported?.(t))return t;return ''}
async function startRecording(r){if(!r)return;if(!cameraReady)try{await startCamera()}catch(e){note(cameraError(e),'error');return}if(recorder?.state==='recording')return;try{const mime=chooseMime();recorder=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1100000,audioBitsPerSecond:64000}):new MediaRecorder(stream)}catch(e){note('Unable to start recorder: '+(e.message||e),'error');return}currentSession={awb:String(r.awb||''),orderId:String(r.orderId||''),status:String(r.status||''),videoType:String(r.videoType||mode||'DISPATCH').toUpperCase()};chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onerror=()=>note('Recorder error.','error');recorder.onstop=finishRecording;recorder.start(1000);recordStartedAt=Date.now();$('cameraPanel').style.display='block';$('cameraLabel').textContent=currentSession.videoType==='RETURN'?'MAKE RETURN VIDEO':'MAKE DISPATCH VIDEO';$('live').style.display='inline';$('timer').textContent='00:00';updateTimer();note('● RECORDING STARTED • Scan next AWB to auto-save and continue.','ok');$('awb').value='';$('awb').focus()}
function updateTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!recorder||recorder.state!=='recording')return;const sec=Math.floor((Date.now()-recordStartedAt)/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},250)}
function stopRecording(){if(recorder?.state==='recording')recorder.stop()}
function stopManual(){nextOrder=null;stopRecording();note('Stopping recording. Video is being saved in the background…','ok')}
function finishRecording(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}$('live').style.display='none';$('timer').textContent='00:00';$('cameraLabel').textContent='CAMERA READY';const s=currentSession,savedChunks=chunks.slice();currentSession=null;chunks=[];recorder=null;const queued=nextOrder;nextOrder=null;if(!s||!savedChunks.length){note('VIDEO SAVE ERROR: recorded video is empty.','error');if(queued)startRecording(queued);return}const blob=new Blob(savedChunks,{type:savedChunks[0].type||'video/webm'});if(!blob.size){note('VIDEO SAVE ERROR: recorded video is empty.','error');if(queued)startRecording(queued);return}if(blob.size>18*1024*1024){note('VIDEO TOO LARGE. Keep each recording below 18 MB.','error');if(queued)startRecording(queued);return}queueUpload(s,blob);if(queued)startRecording(queued)}
function queueUpload(s,blob){uploadQueue++;note('Saving AWB '+s.awb+' in background…','ok');const reader=new FileReader();reader.onerror=()=>{uploadQueue=Math.max(0,uploadQueue-1);note('VIDEO SAVE ERROR: unable to read recorded video.','error')};reader.onload=()=>{try{const d=String(reader.result||''),comma=d.indexOf(',');submitUpload({awb:s.awb,orderId:s.orderId,status:s.status,videoType:s.videoType,fileName:(s.awb||'VIDEO')+'_'+s.videoType+'_'+Date.now()+'.webm',mimeType:blob.type||'video/webm',base64:comma>=0?d.slice(comma+1):d})}catch(e){uploadQueue=Math.max(0,uploadQueue-1);note('VIDEO SAVE ERROR: '+(e.message||e),'error')}};reader.readAsDataURL(blob)}
function submitUpload(payload){if(!API_URL){uploadQueue=Math.max(0,uploadQueue-1);note('VIDEO SAVE ERROR: backend URL missing. Open camera from Google Sheet again.','error');return}const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='DP64_UPLOAD_FRAME';form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();pollSaved(payload.awb,payload.videoType,0)}
function pollSaved(awb,type,attempt){if(attempt>=25){uploadQueue=Math.max(0,uploadQueue-1);note('Upload submitted. Confirmation is delayed; check VIDEO_PROOF.','error');return}setTimeout(()=>apiJsonp('GET_RECORD',{awb:awb,videoType:type},r=>{if(r?.found){uploadQueue=Math.max(0,uploadQueue-1);lastSaved=r;note('✓ VIDEO SAVED • '+awb,'ok');return}pollSaved(awb,type,attempt+1)},15000),attempt<4?1000:2000)}
async function startReturnRecording(awb,orderId,status){if(recorder?.state==='recording'){note('A recording is already active. Stop & Save first.','error');return}await startRecording({awb:String(awb),orderId:String(orderId||''),status:String(status||''),videoType:'RETURN'})}
function downloadFile(id){apiJsonp('DOWNLOAD',{fileId:id},r=>{if(r?.ok&&r.url)window.open(r.url,'_blank','noopener');else note(r?.message||'Download link unavailable.','error')})}
function shareFile(id){apiJsonp('SHARE',{fileId:id},r=>{if(!r?.ok){note(r?.message||'Share link unavailable.','error');return}if(navigator.share)navigator.share({title:'Video Proof',url:r.url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(r.url).then(()=>note('Share link copied.','ok')).catch(()=>window.prompt('Copy share link:',r.url));else window.prompt('Copy share link:',r.url)})}
$('tabDispatch').addEventListener('click',()=>setMode('DISPATCH'));$('tabProof').addEventListener('click',()=>setMode('PROOF'));$('refreshCamera').addEventListener('click',refreshCameras);$('testCamera').addEventListener('click',testCamera);$('scanBtn').addEventListener('click',scan);
$('refreshBtn').addEventListener('click',()=>{if(recorder?.state==='recording'){note('Recording is active. Scan next AWB or press STOP & SAVE.','error');return}$('awb').value='';clearResult();note('Cleared — ready for the next AWB scan.','ok');$('awb').focus()});$('stopBtn').addEventListener('click',stopManual);
$('awb').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scan()}});$('cameraSelect').addEventListener('change',async function(){selectedCameraId=this.value;localStorage.setItem('DP64_CAMERA_ID',selectedCameraId);if(stream&&!(recorder?.state==='recording'))try{await startCamera()}catch(e){note(cameraError(e),'error')}});
window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'){e.preventDefault();e.returnValue='Recording is active.'}if(stream)stream.getTracks().forEach(t=>t.stop())});
(async function init(){await refreshCameras();$('awb').focus();if(API_URL)$('cameraState').textContent='Drive backend linked ✓';else note('Open camera from Google Sheet → DISPATCH CAMERA → Open camera so the Drive save link is attached.','ok')})();
</script>
</body>
</html>
