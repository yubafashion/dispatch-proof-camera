<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISPATCH PROOF CAMERA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}header{background:#fff;color:#202124;text-align:center;padding:10px;font-weight:800;font-size:18px}main{padding:12px;max-width:1000px;margin:auto}.status{background:#202124;border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px}.green{color:#34a853}.red{color:#ea4335}.yellow{color:#fbbc04}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#202124;padding:10px;border-radius:8px;margin-bottom:10px;font-size:12px}.label{color:#aaa;font-size:10px}.value{font-weight:700;margin-top:3px}.video{width:100%;max-height:62vh;object-fit:contain;background:#000;border-radius:8px;display:block}.controls{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:7px;padding:12px 16px;font-weight:800;cursor:pointer}.stop{background:#d93025;color:#fff}.close{background:#e8eaed;color:#202124}.hint{font-size:12px;color:#bbb;margin-top:10px;line-height:1.4}.error{background:#3c1616;color:#ffd5d5;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.hidden{display:none}
</style>
</head>
<body>
<header>🎥 DISPATCH PROOF CAMERA</header>
<main>
  <div id="status" class="status"><span class="yellow">STARTING CAMERA…</span></div>
  <div class="meta">
    <div><div class="label">ORDER ID</div><div id="orderId" class="value">—</div></div>
    <div><div class="label">AWB</div><div id="awb" class="value">—</div></div>
    <div><div class="label">VIDEO TYPE</div><div id="videoType" class="value">—</div></div>
    <div><div class="label">MODE</div><div class="value">SECURE TOP-LEVEL CAMERA</div></div>
  </div>
  <video id="preview" class="video" autoplay muted playsinline></video>
  <div class="controls">
    <button id="stop" class="btn stop" disabled>■ STOP & SAVE</button>
    <button id="close" class="btn close">CLOSE</button>
  </div>
  <div class="hint">Camera permission is requested on this secure top-level page. After permission is allowed, recording starts automatically.</div>
  <div id="error" class="error hidden"></div>
</main>
<script>
(function(){'use strict';
var p=new URLSearchParams(location.search);
var token=p.get('token')||'';
var awb=p.get('awb')||'';
var orderId=p.get('orderId')||'';
var videoType=(p.get('videoType')||'DISPATCH').toUpperCase();
var stream=null,recorder=null,chunks=[],recording=false,started=false;
function el(id){return document.getElementById(id)}
function status(t,c){el('status').innerHTML='<span class="'+c+'">'+t+'</span>'}
function error(t){el('error').textContent=t;el('error').classList.remove('hidden');status('CAMERA ERROR','red')}
el('awb').textContent=awb||'—';el('orderId').textContent=orderId||'—';el('videoType').textContent=videoType;
async function start(){
  if(!window.isSecureContext){throw new Error('This camera page is not running in a secure HTTPS context.');}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){throw new Error('Chrome does not expose camera access on this page. Open the GitHub Pages HTTPS URL, not a file:// URL.');}
  status('REQUESTING CAMERA PERMISSION…','yellow');
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:{ideal:'environment'}},audio:false});
  el('preview').srcObject=stream;
  await el('preview').play().catch(function(){});
  status('CAMERA + RECORDING ACTIVE','green');
  var mt='';
  ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].some(function(x){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(x)){mt=x;return true}return false});
  if(!mt)throw new Error('This Chrome browser does not support WebM MediaRecorder.');
  chunks=[];recorder=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:2200000});
  recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onerror=function(e){error('Recording error: '+((e.error&&e.error.message)||'Unknown error'));};
  recorder.onstop=function(){
    recording=false;started=false;el('stop').disabled=true;
    var blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});chunks=[];
    if(!blob.size){error('Recording is empty.');return}
    send(blob);
  };
  recorder.start(1000);recording=true;started=true;el('stop').disabled=false;
}
function send(blob){
  status('SENDING RECORDING TO DISPATCH PROOF…','yellow');
  var reader=new FileReader();
  reader.onload=function(){
    var data=String(reader.result||'');
    var comma=data.indexOf(',');
    var base64=comma>=0?data.slice(comma+1):data;
    try{
      if(window.opener){window.opener.postMessage({type:'DP40_RECORDING',token:token,base64:base64,mimeType:blob.type||'video/webm',awb:awb,orderId:orderId,videoType:videoType,ext:'webm'},'*');status('RECORDING SENT — YOU CAN CLOSE THIS TAB','green');setTimeout(function(){try{window.close()}catch(e){}},1200)}
      else error('The Dispatch Proof Management window is not available. Keep this tab open and return to Management.');
    }catch(e){error('Could not send recording back to Dispatch Proof: '+e.message)}
  };
  reader.onerror=function(){error('Could not read the recording for upload.')};
  reader.readAsDataURL(blob);
}
el('stop').addEventListener('click',function(){if(!recording||!recorder)return;status('STOPPING RECORDING…','yellow');try{recorder.stop()}catch(e){error(e.message)}});
el('close').addEventListener('click',function(){try{if(recorder&&recording)recorder.stop();else window.close()}catch(e){window.close()}});
window.addEventListener('beforeunload',function(){try{if(stream)stream.getTracks().forEach(function(t){t.stop()})}catch(e){}});
start().catch(function(e){error(String(e&&e.message||e));});
})();
</script>
</body>
</html>
