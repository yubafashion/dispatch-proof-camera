<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Permissions-Policy" content="camera=*; microphone=*">
<title>DISPATCH PROOF CAMERA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;background:#111}
.head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#202124;border-bottom:1px solid #3a3a3a}
.brand{font-weight:800;font-size:15px}.state{font-size:11px;color:#b9c0c8}
.main{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;background:#000}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#b9c0c8;background:#111}
.controls{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;gap:8px;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.9))}
button{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.allow{background:#1a73e8;color:#fff}.stop{background:#d93025;color:#fff}.secondary{background:#e8eaed;color:#202124}
.rec{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.75);padding:7px 10px;border-radius:8px;font-weight:800;font-size:13px}.timer{margin-left:8px;color:#fff}.live{color:#ff6b6b}
.foot{height:34px;background:#202124;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9aa0a6}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="brand">🎥 DISPATCH PROOF CAMERA</div><div id="state" class="state">READY</div></div>
  <div class="main">
    <video id="preview" autoplay muted playsinline></video>
    <div id="empty" class="empty">Camera is ready.<br>Click ALLOW CAMERA from Management if permission is required.</div>
    <div id="rec" class="rec" style="display:none"><span class="live">● RECORDING</span><span id="timer" class="timer">00:00</span></div>
    <div class="controls">
      <button id="allow" class="allow" onclick="requestCamera()">ALLOW CAMERA</button>
      <button id="stop" class="stop" style="display:none" onclick="stopRecording()">■ STOP &amp; SAVE</button>
    </div>
  </div>
  <div class="foot">SECURE CAMERA BRIDGE • VIDEO IS RETURNED TO DISPATCH PROOF MANAGEMENT</div>
</div>
<script>
const SOURCE='DISPATCH_PROOF_CAMERA_BRIDGE';
const PARAMS=new URLSearchParams(location.search);
const BRIDGE_VERSION=PARAMS.get('bridgeVersion')||'V38_SAME_PAGE_SAVE_FIX_20260831';
const BRIDGE_ID=PARAMS.get('session')||('bridge_'+Date.now()+'_'+Math.random().toString(36).slice(2));
let stream=null, recorder=null, chunks=[], startedAt=0, timerHandle=null, session=null;
const $=id=>document.getElementById(id);
function send(type,extra){
  try{window.parent.postMessage(Object.assign({source:SOURCE,type:type,version:BRIDGE_VERSION,bridgeId:BRIDGE_ID},extra||{}),'*')}catch(e){}
}
function setState(t){$('state').textContent=t}
function friendlyError(e){
  const n=e&&e.name||'';
  if(n==='NotAllowedError'||n==='PermissionDeniedError') return 'Camera permission denied. Allow camera access for this site, then press ALLOW CAMERA.';
  if(n==='NotFoundError') return 'No camera was found on this device.';
  if(n==='NotReadableError') return 'Camera is busy or unavailable. Close other camera apps and retry.';
  if(n==='SecurityError') return 'Camera access is blocked by browser security or permissions policy.';
  return (e&&e.message)||'Unable to access camera.';
}
async function requestCamera(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('Camera API is unavailable in this browser.');
    if(stream) stopTracks();
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:{ideal:'environment'}},audio:true});
    $('preview').srcObject=stream;
    $('empty').style.display='none';
    $('allow').textContent='CAMERA READY ✓';
    setState('CAMERA READY ✓');
    send('CAMERA_READY');
    if(window.parent!==window) window.parent.postMessage({source:SOURCE,type:'DEVICE_LIST_READY',version:BRIDGE_VERSION,bridgeId:BRIDGE_ID},'*');
    return true;
  }catch(e){
    setState('CAMERA ERROR');
    $('empty').style.display='flex';
    $('empty').innerHTML='<b>'+escapeHtml(friendlyError(e))+'</b>';
    send('CAMERA_ERROR',{message:friendlyError(e),name:e&&e.name||''});
    return false;
  }
}
function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function chooseMime(){
  const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const t of types){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)) return t}
  return '';
}
async function startRecording(s){
  session=s||{};
  if(recorder&&recorder.state==='recording') return;
  if(!stream){const ok=await requestCamera();if(!ok)return}
  try{
    chunks=[];
    const mime=chooseMime();
    recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onerror=e=>send('CAMERA_ERROR',{message:'Recorder error.'});
    recorder.onstop=finishRecording;
    recorder.start(1000);
    startedAt=Date.now();
    $('rec').style.display='block';$('stop').style.display='inline-block';$('allow').style.display='none';
    setState('RECORDING');updateTimer();
    send('RECORDING_STARTED',{session:session});
  }catch(e){send('CAMERA_ERROR',{message:e.message||'Unable to start recording.'});setState('CAMERA ERROR')}
}
function updateTimer(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle=setInterval(()=>{const sec=Math.floor((Date.now()-startedAt)/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},250);
}
function stopRecording(){
  if(recorder&&recorder.state==='recording') recorder.stop();
}
function finishRecording(){
  if(timerHandle){clearInterval(timerHandle);timerHandle=null}
  const mime=(chunks[0]&&chunks[0].type)||'video/webm';
  const blob=new Blob(chunks,{type:mime});
  const fileName=(session&&session.awb?session.awb:'VIDEO')+'_'+(session&&session.videoType?session.videoType:'DISPATCH')+'_'+Date.now()+'.webm';
  recorder=null;chunks=[];
  $('rec').style.display='none';$('stop').style.display='none';$('allow').style.display='inline-block';
  setState('VIDEO READY');
  send('VIDEO_READY',{blob:blob,fileName:fileName,session:session});
  session=null;
}
window.addEventListener('message',async event=>{
  const d=event.data||{};
  if(!d||d.source!=='DISPATCH_PROOF_PARENT')return;
  if(d.type==='REQUEST_CAMERA') await requestCamera();
  else if(d.type==='START_RECORDING') await startRecording(d.session||{});
  else if(d.type==='STOP_RECORDING') stopRecording();
  else if(d.type==='PING') send('BRIDGE_READY');
});
function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
setState('BRIDGE READY');
send('BRIDGE_READY');
</script>
</body>
</html>
