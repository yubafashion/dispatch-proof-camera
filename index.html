<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISPATCH PROOF MANAGEMENT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#202124}button,input,select{font:inherit}
.top{background:#fff;padding:10px 14px;text-align:center;border-bottom:1px solid #d9dee5}.title{font-size:21px;font-weight:800}.ag{font-size:11px;font-weight:800;letter-spacing:2px;color:#5f6368;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #d9dee5}.tab{flex:1;padding:11px;text-align:center;font-weight:800;cursor:pointer}.active{background:#202124;color:#fff}
.tools,.scan{background:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #d9dee5}.tools select{height:36px;min-width:240px;border:1px solid #bdc5d1;border-radius:7px;padding:0 8px}.status{font-size:12px;color:#5f6368}
input{flex:1;height:42px;border:1px solid #b7c0cc;border-radius:7px;padding:0 12px;font-size:16px}button{height:38px;border:0;border-radius:7px;padding:0 13px;font-weight:800;cursor:pointer}.primary{background:#1a73e8;color:#fff}.gray{background:#e8eaed}.red{background:#d93025;color:#fff}.green{background:#188038;color:#fff}.orange{background:#f9ab00;color:#111}
.notice{margin:8px 12px;padding:9px 11px;background:#fff8e1;color:#6b4e00;border-radius:7px;font-size:12px}.notice.err{background:#fce8e6;color:#b31412}.notice.ok{background:#e6f4ea;color:#137333}
.main{padding:8px 12px}.cameraBox{background:#111;border-radius:9px;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.cameraBox video{width:100%;height:430px;object-fit:contain;background:#000}.cameraPrompt{color:#fff;text-align:center;font-weight:800;font-size:18px;padding:25px}.recBar{position:absolute;left:10px;right:10px;top:10px;display:none;justify-content:space-between;color:#fff;font-weight:800;text-shadow:0 1px 2px #000}.live{color:#ff6b6b}.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:11px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.label{font-size:10px;color:#6b7280}.value{font-weight:800;margin-top:2px}.ready{color:#188038}.required{color:#d93025}.controls{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.videoBox{background:#111;color:#fff;border-radius:8px;padding:8px;margin-top:8px}.videoBox video{width:100%;max-height:280px}.muted{color:#6b7280;font-size:11px}
</style></head><body>
<div class="top"><div class="title">🎥 DISPATCH PROOF MANAGEMENT</div><div class="ag">AG</div></div>
<div class="tabs"><div id="td" class="tab active">🎥 MAKE DISPATCH VIDEO</div><div id="tp" class="tab">🎥 VIDEO PROOF</div></div>
<div class="tools"><b>CAMERA</b><select id="cams"></select><button class="gray" id="refreshCam">REFRESH CAMERA</button><button class="primary" id="testCam">TEST CAMERA</button><span id="camState" class="status">Camera not started</span></div>
<div class="scan"><input id="awb" placeholder="SCAN AWB BARCODE..." autocomplete="off"><button class="primary" id="scanBtn">SCAN</button><button class="gray" id="clearBtn">REFRESH</button></div>
<div id="notice" class="notice">Click TEST CAMERA once, allow camera, and wait for CAMERA READY.</div>
<div class="main">
<div class="cameraBox"><div id="prompt" class="cameraPrompt">CLICK TEST CAMERA ONCE<br>THEN ALLOW CAMERA</div><video id="preview" autoplay muted playsinline></video><div id="recBar" class="recBar"><span class="live">● RECORDING</span><span id="timer">00:00</span></div></div>
<div id="info" class="card"><span class="muted">Scan one AWB. Nothing else is loaded.</span></div>
<div id="result"></div>
</div>
<script>
const BRIDGE_ORIGIN='https://script.google.com';
const EXPECTED_VERSION=new URLSearchParams(location.search).get('bridgeVersion')||'';
let bridge=null, mode='DISPATCH', stream=null, recorder=null, chunks=[], current=null, pendingScan=null, req=0, waiting=new Map(), timer=null, startedAt=0;
const $=id=>document.getElementById(id);
function msg(text,kind=''){const n=$('notice');n.textContent=text;n.className='notice '+kind}
function request(type,data={}){return new Promise((resolve,reject)=>{const id='r'+(++req)+'_'+Date.now();waiting.set(id,{resolve,reject});bridge.postMessage(Object.assign({source:'DISPATCH_PROOF_EXTERNAL_MANAGEMENT',type,requestId:id},data),'*');setTimeout(()=>{if(waiting.has(id)){waiting.delete(id);reject(new Error('No response from Sheet bridge.'))}},30000)})}
function setCamState(t){$('camState').textContent=t}
function connectBridge(){
  if(!window.opener){msg('Management was not opened from DISPATCH PROOF. Close this window and open it from the Sheet menu.','err');return}
  bridge=window.opener;
  bridge.postMessage({source:'DISPATCH_PROOF_EXTERNAL_MANAGEMENT',type:'MANAGEMENT_READY',version:EXPECTED_VERSION},'*');
}
window.addEventListener('message',e=>{
  if(e.source!==bridge)return; const d=e.data||{}; if(d.source!=='DISPATCH_PROOF_SHEET_BRIDGE')return;
  if(d.type==='BRIDGE_READY'){setCamState('Management bridge connected');msg('Bridge connected. Click TEST CAMERA.','ok');return}
  const p=waiting.get(d.requestId); if(p){waiting.delete(d.requestId); if(d.type==='ERROR')p.reject(new Error(d.message||'Bridge error')); else p.resolve(d.result)}
});
async function refreshCameras(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices){msg('Camera API is unavailable in this browser.','err');return}
  try{const ds=await navigator.mediaDevices.enumerateDevices();$('cams').innerHTML='';ds.filter(x=>x.kind==='videoinput').forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('Camera '+(i+1));$('cams').appendChild(o)})}catch(e){msg('Camera list error: '+e.message,'err')}
}
async function startCamera(){
  if(stream){setCamState('Camera ready ✓');return true}
  try{
    setCamState('Requesting camera permission...'); msg('Allow camera access in the browser prompt, then wait for CAMERA READY.');
    stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:$('cams').value?{exact:$('cams').value}:undefined,width:{ideal:1280},height:{ideal:720},facingMode:'environment'},audio:true});
    $('preview').srcObject=stream;$('prompt').style.display='none';await $('preview').play().catch(()=>{});await refreshCameras();setCamState('Camera ready ✓');msg('CAMERA READY ✓ — LIVE PREVIEW is active.','ok');return true;
  }catch(e){stream=null;setCamState('Camera permission/error');msg('Camera could not start: '+e.name+' — '+e.message,'err');return false}
}
async function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('prompt').style.display='block';setCamState('Camera stopped')}}
function startTimer(){startedAt=Date.now();$('timer').textContent='00:00';clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)}
function stopTimer(){clearInterval(timer);timer=null;$('timer').textContent='00:00'}
async function beginRecording(r){
  if(!stream){if(!(await startCamera()))return}
  current=r;chunks=[];
  let options={}; if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus'))options.mimeType='video/webm;codecs=vp9,opus'; else if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus'))options.mimeType='video/webm;codecs=vp8,opus';
  try{recorder=new MediaRecorder(stream,options)}catch(e){msg('Recorder error: '+e.message,'err');return}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{stopTimer();$('recBar').style.display='none';const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});const save=current;recorder=null;chunks=[];if(!save)return;msg('VIDEO SAVING — please wait...');try{const r=await request('SAVE_VIDEO',{awb:save.awb,orderId:save.orderId,status:save.status,videoType:save.videoType,fileName:save.awb+'_'+save.videoType+'_'+Date.now()+'.webm',blob});renderSaved(r);msg('✓ VIDEO SAVED • '+save.awb,'ok');if(pendingScan){const n=pendingScan;pendingScan=null;await handleScan(n.awb,n.mode,true)}}catch(e){msg('VIDEO SAVE ERROR: '+e.message,'err')}};
  recorder.start(250);$('recBar').style.display='flex';startTimer();msg('● RECORDING STARTED — scan next AWB to auto-save.','ok');
}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop()}
async function scan(){const v=$('awb').value.trim();if(!v){msg('Please scan AWB.');return}const m=mode;if(recorder&&recorder.state==='recording'){pendingScan={awb:v,mode:m};msg('Saving previous AWB before starting the new AWB...');stopRecording();return}await handleScan(v,m,false)}
async function handleScan(v,m,afterSave){
  $('awb').value='';
  try{const r=await request('SCAN_AWB',{awb:v,mode:m}); if(!r||!r.found){msg(r&&r.message?r.message:'AWB not found.','err');return}
    if(r.terminal){renderResult(r);msg('This order is already delivered successfully. No video proof is required.');return}
    if(m==='DISPATCH'){renderDispatch(r);await beginRecording({awb:r.awb,orderId:r.orderId,status:r.status||'',videoType:'DISPATCH'});}
    else {renderProof(r)}
  }catch(e){msg(e.message,'err')}
}
function renderDispatch(r){$('info').innerHTML='<div class="grid"><div><div class="label">DATE</div><div class="value">'+esc(r.date)+'</div></div><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">DISPATCH TYPE</div><div class="value">'+esc(r.dispatchType)+'</div></div></div>'}
function renderProof(r){let h='<div class="card"><div class="grid"><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">LIVE STATUS</div><div class="value">'+esc(r.status||'')+'</div></div><div><div class="label">DISPATCH VIDEO</div><div class="value '+(r.dispatchVideo?'ready':'required')+'">'+(r.dispatchVideo?'VIDEO READY':'NOT AVAILABLE')+'</div></div></div>';
if(r.dispatchVideo)h+='<div class="videoBox"><b>DISPATCH VIDEO</b><video controls playsinline src="'+esc(r.dispatchVideo.downloadUrl)+'"></video><div class="controls"><a class="primary" href="'+esc(r.dispatchVideo.downloadUrl)+'" target="_blank">DOWNLOAD</a></div></div>';
if(r.returnVideo)h+='<div class="videoBox"><b>RETURN VIDEO • READY</b><video controls playsinline src="'+esc(r.returnVideo.downloadUrl)+'"></video></div>';else if(r.status)h+='<div class="controls"><button class="orange" onclick="makeReturn('+js(r.awb)+','+js(r.orderId)+','+js(r.status)+')">MAKE RETURN VIDEO</button></div>';
h+='</div>';$('result').innerHTML=h}
async function makeReturn(awb,orderId,status){if(recorder){msg('Stop current recording first.');return}await beginRecording({awb:String(awb),orderId:String(orderId||''),status:String(status||''),videoType:'RETURN'})}
function renderSaved(r){$('result').innerHTML='<div class="card"><b class="ready">VIDEO READY • '+esc(r.awb)+'</b><div class="muted">'+esc(r.fileName||'')+'</div></div>'}
function renderResult(r){$('result').innerHTML='<div class="card"><b>'+esc(r.message||'No video proof required.')+'</b></div>'}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function js(v){return JSON.stringify(String(v==null?'':v))}
$('testCam').onclick=startCamera;$('refreshCam').onclick=async()=>{if(recorder){msg('Recording is active. Stop & Save first.');return}await stopStream();await refreshCameras()};$('scanBtn').onclick=scan;$('clearBtn').onclick=()=>{$('awb').value='';$('result').innerHTML='';msg('Ready for next AWB.');$('awb').focus()};$('awb').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scan()}});
$('td').onclick=()=>{if(recorder){msg('Recording active.');return}mode='DISPATCH';$('td').classList.add('active');$('tp').classList.remove('active');msg('DISPATCH mode — scan AWB to start recording.')};$('tp').onclick=()=>{if(recorder){msg('Recording active.');return}mode='PROOF';$('tp').classList.add('active');$('td').classList.remove('active');msg('VIDEO PROOF mode — scan AWB to load proof.')};
connectBridge();refreshCameras();$('awb').focus();
</script></body></html>
