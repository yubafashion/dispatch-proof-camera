<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISPATCH PROOF MANAGEMENT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#f4f6f8;color:#202124}
.top{background:#fff;padding:7px 10px;border-bottom:1px solid #d9dee5;text-align:center}.title{font-size:18px;font-weight:800}.ag{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#5f6368;margin-top:1px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #d9dee5}.tab{flex:1;text-align:center;padding:8px;font-weight:800;cursor:pointer}.active{background:#202124;color:#fff}
.tools{background:#fff;padding:6px 9px;border-bottom:1px solid #d9dee5;display:flex;gap:7px;align-items:center}.tools select{height:34px;min-width:210px;border:1px solid #c4cbd5;border-radius:6px;padding:0 7px}.status{font-size:11px;color:#5f6368}.scan{background:#fff;padding:7px 9px;display:flex;gap:7px;border-bottom:1px solid #d9dee5}.scan input{flex:1;height:40px;border:1px solid #aeb7c4;border-radius:7px;padding:0 11px;font-size:16px}.btn{height:38px;border:0;border-radius:7px;padding:0 12px;font-weight:800;cursor:pointer}.primary{background:#1a73e8;color:#fff}.gray{background:#e8eaed;color:#202124}.red{background:#d93025;color:#fff}.orange{background:#f9ab00;color:#202124}
.main{padding:6px 9px;height:calc(100% - 168px);overflow:auto}.notice{display:none;background:#fff8e1;color:#6b4e00;border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:11px}.notice.error{background:#fce8e6;color:#b3261e}.info,.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:9px;margin-bottom:6px;font-size:11px}.card{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.label{font-size:10px;color:#6b7280}.value{font-weight:800;font-size:13px;margin-top:2px}.required{color:#d93025;font-weight:800}.ready{color:#188038;font-weight:800}.empty{text-align:center;padding:24px;color:#6b7280;background:#fff;border:1px solid #dfe3e8;border-radius:8px}
.cameraBox{background:#111;color:#fff;border-radius:8px;padding:7px;margin-bottom:6px}.cameraBar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.meta{font-size:10px;color:#c9cacc}.live{color:#ff6b6b;font-weight:900}.timer{font-size:22px;font-weight:900;letter-spacing:1px}.saveq{font-size:10px;color:#ffd54f;font-weight:800;margin-top:1px}.cameraBox video{display:block;width:100%;height:380px;object-fit:contain;background:#000;border-radius:6px}.controls{display:flex;gap:7px;margin-top:6px}.hidden{display:none}
@media(max-width:800px){.cameraBox video{height:280px}.grid{grid-template-columns:1fr}.tools select{min-width:150px}}
</style></head>
<body>
<div class="top"><div class="title">🎥 DISPATCH PROOF MANAGEMENT</div><div class="ag">AG</div></div>
<div class="tabs"><div id="td" class="tab active">🎥 MAKE DISPATCH VIDEO</div><div id="tp" class="tab">🎥 VIDEO PROOF</div></div>
<div class="tools"><b style="font-size:11px">CAMERA</b><select id="cameraSelect"></select><button id="refreshCamera" class="btn gray">REFRESH CAMERA</button><button id="testCamera" class="btn primary">TEST CAMERA</button><span id="cameraState" class="status">Camera not started</span></div>
<div class="scan"><input id="awb" autocomplete="off" autofocus placeholder="SCAN AWB BARCODE..."><button id="scanBtn" class="btn primary">SCAN</button><button id="clearBtn" class="btn gray">REFRESH</button></div>
<div class="main"><div id="notice" class="notice"></div>
<div class="cameraBox"><div class="cameraBar"><div><b id="modeTitle">READY • SCAN AWB</b><div id="sessionMeta" class="meta">Camera ready • scan AWB to start recording</div></div><div style="text-align:right"><div id="recordBadge" class="live hidden">● RECORDING <span id="timer" class="timer">00:00</span></div><div id="saveQueue" class="saveq">BACKGROUND SAVES: 0</div></div></div><video id="preview" autoplay muted playsinline></video><div class="controls"><button id="stopBtn" class="btn red hidden">■ STOP & SAVE</button><span id="cameraDiag" class="meta">Camera: NOT STARTED</span></div></div>
<div id="info" class="info">Scan one AWB. Nothing else is loaded.</div><div id="result" class="card"></div><div id="empty" class="empty">SCAN AWB TO LOAD ONLY THAT ORDER</div></div>
<script>
'use strict';
const VERSION='V43_EMBEDDED_FULL_MANAGEMENT_20260831';
const preview=document.getElementById('preview'), cameraSelect=document.getElementById('cameraSelect'), cameraState=document.getElementById('cameraState'), cameraDiag=document.getElementById('cameraDiag');
const awb=document.getElementById('awb'), notice=document.getElementById('notice'), result=document.getElementById('result'), empty=document.getElementById('empty'), info=document.getElementById('info');
const stopBtn=document.getElementById('stopBtn'), recordBadge=document.getElementById('recordBadge'), timer=document.getElementById('timer'), modeTitle=document.getElementById('modeTitle'), sessionMeta=document.getElementById('sessionMeta');
let mode='DISPATCH',stream=null,recorder=null,chunks=[],currentSession=null,nextOrder=null,recordingStartedAt=0,timerId=null,selectedCameraId=localStorage.getItem('DP21_CAMERA_ID')||'',pendingRequests=new Map(),backgroundSaves=0,scanLock=false;
function updateSaveQueue(){document.getElementById('saveQueue').textContent='BACKGROUND SAVES: '+backgroundSaves}
function setNotice(t,error){notice.textContent=t||'';notice.className='notice'+(error?' error':'');notice.style.display=t?'block':'none'}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parentRequest(type,payload){return new Promise((resolve,reject)=>{const id='req_'+Date.now()+'_'+Math.random().toString(36).slice(2);pendingRequests.set(id,{resolve,reject});try{window.parent.postMessage({source:'DISPATCH_PROOF_FULL_MANAGEMENT',type,requestId:id,version:VERSION,payload:payload||{}},'*')}catch(e){pendingRequests.delete(id);reject(e)}})}
window.addEventListener('message',e=>{const d=e.data||{};if(!d||d.source!=='DISPATCH_PROOF_PARENT')return;if(d.type==='RESPONSE'&&pendingRequests.has(d.requestId)){const p=pendingRequests.get(d.requestId);pendingRequests.delete(d.requestId);if(d.error)p.reject(new Error(d.error));else p.resolve(d.result)}});
function clearResult(){result.style.display='none';result.innerHTML='';empty.style.display='block'}
function showScanned(r,active){empty.style.display='none';result.innerHTML='<div class="grid"><div><div class="label">DATE</div><div class="value">'+esc(r.date)+'</div></div><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">DISPATCH TYPE</div><div class="value">'+esc(r.dispatchType)+'</div></div></div><div style="margin-top:7px" class="'+(active?'ready':'required')+'">'+(active?'● VIDEO RECORDING ACTIVE':'● WAITING FOR RECORDING')+'</div>';result.style.display='block'}
function showProof(r){empty.style.display='none';let h='<div class="grid"><div><div class="label">ORDER ID</div><div class="value">'+esc(r.orderId)+'</div></div><div><div class="label">AWB</div><div class="value">'+esc(r.awb)+'</div></div><div><div class="label">LIVE STATUS</div><div class="value">'+esc(r.status||'')+'</div></div><div><div class="label">DISPATCH VIDEO</div><div class="value '+(r.dispatchVideo?'ready':'required')+'">'+(r.dispatchVideo?'VIDEO READY':'NOT AVAILABLE')+'</div></div></div>';result.innerHTML=h;result.style.display='block'}
async function enumerateCameras(){try{if(!navigator.mediaDevices?.enumerateDevices)throw new Error('Camera API is not available.');let ds=await navigator.mediaDevices.enumerateDevices();let cams=ds.filter(d=>d.kind==='videoinput');if(!cams.length)return[];cameraSelect.innerHTML='';cams.forEach((c,i)=>{let o=document.createElement('option');o.value=c.deviceId;o.textContent=c.label||('Camera '+(i+1));cameraSelect.appendChild(o)});if(!cams.some(c=>c.deviceId===selectedCameraId))selectedCameraId=cams[0].deviceId;cameraSelect.value=selectedCameraId;return cams}catch(e){setCameraError(e);return[]}}
function setCameraError(e){let n=e?.name||'';let m=e?.message||String(e);if(n==='NotAllowedError')m='Camera permission denied. Allow camera access for this page.';if(n==='NotReadableError')m='Camera is busy in another application.';cameraState.textContent=m;cameraDiag.textContent='Camera: ERROR';setNotice(m,true)}
async function openCamera(){try{if(stream?.getTracks().some(t=>t.readyState==='live'))return true;if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera API is not available.');let c=selectedCameraId?{video:{deviceId:{exact:selectedCameraId}},audio:true}:{video:true,audio:true};try{stream=await navigator.mediaDevices.getUserMedia(c)}catch(e){stream=await navigator.mediaDevices.getUserMedia(selectedCameraId?{video:{deviceId:{exact:selectedCameraId}},audio:false}:{video:true,audio:false})}preview.srcObject=stream;await preview.play().catch(()=>{});cameraState.textContent='Camera ready ✓';cameraDiag.textContent='Camera: READY';await enumerateCameras();return true}catch(e){setCameraError(e);return false}}
async function testCamera(){if(recorder?.state==='recording'){setNotice('Recording active. Scan next AWB or press STOP & SAVE.');return}setNotice('Opening camera permission...');if(await openCamera())setNotice('Camera test successful ✓ • live preview ready.')}
async function scan(){if(scanLock)return;const v=awb.value.trim();if(!v){setNotice('Please scan AWB.',true);return}scanLock=true;setNotice('Looking up AWB '+v+'...');try{const r=await parentRequest('SCAN_AWB',{awb:v,mode:mode});if(!r||!r.found){setNotice(r?.message||'AWB not found.',true);return}if(r.terminal){setNotice('This order is already successfully delivered. No proof required.');awb.value='';return}if(mode==='PROOF'){showProof(r);awb.value='';setNotice('AWB loaded.');return}if(!stream||!stream.getTracks().some(t=>t.readyState==='live')){setNotice('Camera is not ready. Click TEST CAMERA once, then scan AWB.',true);return}if(recorder?.state==='recording'){nextOrder=r;awb.value='';setNotice('Next AWB received • current video is being handed to background save • next recording starts now.');stopRecording();return}awb.value='';currentSession={awb:String(r.awb),orderId:String(r.orderId||''),status:String(r.status||''),videoType:'DISPATCH'};showScanned(r,false);await startRecording(currentSession)}catch(e){setNotice(e.message||String(e),true)}finally{scanLock=false}}
async function startRecording(s){if(!s||recorder?.state==='recording')return;if(!stream||!stream.getTracks().some(t=>t.readyState==='live')){if(!await openCamera())return}chunks=[];let mime='';for(const x of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']){if(MediaRecorder.isTypeSupported?.(x)){mime=x;break}}try{recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){setNotice('Recorder could not start: '+e.message,true);return}recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onerror=e=>setNotice('Recording error: '+(e.error?.message||''),true);recorder.onstart=()=>{recordBadge.classList.remove('hidden');stopBtn.classList.remove('hidden');modeTitle.textContent='● RECORDING';sessionMeta.textContent='AWB: '+s.awb+' • Order ID: '+s.orderId;recordingStartedAt=Date.now();timer.textContent='00:00';clearInterval(timerId);timerId=setInterval(()=>{if(recorder?.state==='recording'){let sec=Math.floor((Date.now()-recordingStartedAt)/1000);timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},250);showScanned(s,true);setNotice('● RECORDING ACTIVE • Scan next AWB or press STOP & SAVE.')};recorder.onstop=()=>{clearInterval(timerId);timerId=null;recordBadge.classList.add('hidden');stopBtn.classList.add('hidden');modeTitle.textContent='READY • SCAN AWB';let saved=currentSession;let blob=new Blob(chunks,{type:(chunks[0]?.type)||mime||'video/webm'});chunks=[];recorder=null;currentSession=null;if(!blob.size){setNotice('Recording produced an empty video.',true);return}backgroundSaves++;updateSaveQueue();saveInBackground(saved,blob);if(nextOrder){let n=nextOrder;nextOrder=null;currentSession={awb:String(n.awb),orderId:String(n.orderId||''),status:String(n.status||''),videoType:'DISPATCH'};showScanned(n,false);startRecording(currentSession)}else{setNotice('Video handed to background save ✓ • Ready for next AWB.')}};try{recorder.start(1000)}catch(e){recorder=null;setNotice('Recording start failed: '+e.message,true)}}
function saveInBackground(s,blob){parentRequest('SAVE_VIDEO',{awb:s.awb,orderId:s.orderId,status:s.status,videoType:s.videoType,mimeType:blob.type||'video/webm',fileName:s.awb+'_'+s.videoType+'.webm',blob:blob}).then(()=>{backgroundSaves--;updateSaveQueue()}).catch(e=>{backgroundSaves--;updateSaveQueue();setNotice('BACKGROUND SAVE ERROR • AWB '+s.awb+': '+(e.message||e),true)})}
function stopRecording(){if(recorder?.state==='recording'){try{recorder.stop();return true}catch(e){setNotice(e.message,true)}}return false}
stopBtn.onclick=()=>stopRecording();document.getElementById('scanBtn').onclick=scan;document.getElementById('testCamera').onclick=testCamera;document.getElementById('clearBtn').onclick=()=>{if(recorder?.state==='recording'){setNotice('Recording active. Scan next AWB or press STOP & SAVE.');return}awb.value='';clearResult();setNotice('Ready for next AWB.');awb.focus()};awb.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scan()}});document.getElementById('refreshCamera').onclick=async()=>{if(recorder?.state==='recording'){setNotice('Cannot refresh camera while recording.');return}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}await enumerateCameras();setNotice('Camera list refreshed. Click TEST CAMERA if needed.')};cameraSelect.onchange=async function(){if(recorder?.state==='recording'){setNotice('Cannot change camera while recording.');return}selectedCameraId=this.value;localStorage.setItem('DP21_CAMERA_ID',selectedCameraId);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}await openCamera()};td.onclick=()=>{if(recorder?.state==='recording')return;mode='DISPATCH';td.classList.add('active');tp.classList.remove('active');info.textContent='Dispatch: scan AWB → recording starts automatically. Scan next AWB to continue without waiting for save.';clearResult();awb.focus()};tp.onclick=()=>{if(recorder?.state==='recording')return;mode='PROOF';tp.classList.add('active');td.classList.remove('active');info.textContent='Proof: scan AWB → existing dispatch video/status is shown.';clearResult();awb.focus()};
(async function(){try{await enumerateCameras()}catch(e){}info.textContent='FULL MANAGEMENT • AWB SCAN + CAMERA + RECORDING + STOP & SAVE';awb.focus();try{window.parent.postMessage({source:'DISPATCH_PROOF_FULL_MANAGEMENT',type:'FULL_READY',version:VERSION},'*')}catch(e){}})();
</script></body></html>
