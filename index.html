<body>
<div class="app">
  <div class="top">
    <div class="title">DISPATCH PROOF MANAGEMENT</div>
    <div class="ag">V72 FAST SAVE</div>
  </div>

  <div class="tabs">
    <div id="tabDispatch" class="tab active">🎥 MAKE DISPATCH VIDEO</div>
    <div id="tabProof" class="tab">🎥 VIDEO PROOF</div>
  </div>

  <div class="tools">
    <b>CAMERA</b>
    <select id="cameraSelect"><option value="">Camera</option></select>
    <button id="refreshCamera" class="gray">REFRESH CAMERA</button>
    <button id="testCamera" class="primary">TEST CAMERA</button>
    <span id="cameraState" class="status">Camera not started</span>
  </div>

  <div class="scan">
    <input id="awb" autofocus autocomplete="off" placeholder="SCAN AWB BARCODE...">

  </div>

  <div class="main">
    <div id="notice" class="notice"></div>
    <div id="info" class="info">
      Dispatch: scan AWB → order details → recording starts automatically.
      Scan next AWB to save the previous video and continue.
    </div>

    <div id="cameraPanel" class="cameraPanel">
      <div class="cameraHead">
        <span id="cameraLabel">CAMERA READY</span>
        <span><span id="live" class="live" style="display:none">● RECORDING</span><span id="timer" class="timer">00:00</span></span>
      </div>
      <video id="cameraFrame" class="cameraFrame" autoplay muted playsinline></video>
      <div class="cameraControls">
        <button id="stopBtn" class="red">■ STOP &amp; SAVE</button>
      </div>
    </div>

    <div id="result" class="card"></div>
    <div id="empty" class="empty">SCAN AWB TO LOAD ONLY THAT ORDER</div>
  </div>
</div>

<iframe id="uploadFrame" name="DP50_UPLOAD_FRAME"></iframe>

<script>
'use strict';

/*
 * Single-window architecture:
 * This page is a normal HTTPS top-level page on GitHub Pages.
 * Therefore getUserMedia() is requested from a real HTTPS origin,
 * not from Apps Script HTMLService.
 */

function normalizeApiUrl(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  if (/googleusercontent\.com\/macros\/echo/i.test(s)) return '';
  const exec = s.match(/^(https:\/\/script\.google\.com\/(?:macros|a\/macros\/[^/]+)\/s\/[^/?#]+\/(?:exec|dev))/i);
  if (exec) return exec[1];
  if (/^https:\/\/script\.google\.com\/macros\/s\//i.test(s)) {
    return s.split('#')[0].split('?')[0].replace(/\/+$/, '');
  }
  return '';
}

const params = new URLSearchParams(location.search);
const API_URL = normalizeApiUrl(params.get('api') || localStorage.getItem('DP50_API_URL') || '');
const API_VERSION = 'V58_TOP_POSTMESSAGE_20260831';
if (API_URL) localStorage.setItem('DP50_API_URL', API_URL);
else localStorage.removeItem('DP50_API_URL');

let bridgeFrame = null;
let workerFrame = null;
let workerWin = null;
let workerReady = false;
let bridgePending = {};
let bridgeSeq = 0;
let bridgeListening = false;

let mode = 'DISPATCH';
let stream = null;
let recorder = null;
let recorderMime = '';
let chunks = [];
let currentSession = null;
let nextOrder = null;
let waitingOrder = null;
let timerHandle = null;
let recordStartedAt = 0;
let cameraReady = false;
let selectedCameraId = localStorage.getItem('DP50_CAMERA_ID') || '';
let uploadQueue = 0;
let savedAwbs = {};

const $ = id => document.getElementById(id);

function note(text, kind='') {
  const e = $('notice');
  e.textContent = text || '';
  e.className = 'notice ' + (kind || '');
  e.style.display = text ? 'block' : 'none';
}

function requireApi() {
  if (!API_URL) {
    note(
      'Open the camera from the Google Sheet: DISPATCH CAMERA → Open camera. That attaches the save link automatically.',
      'error'
    );
    return false;
  }
  return true;
}

function onBridgeMessage(ev) {
  const d = ev.data;
  if (!d || d.dp !== 1) return;
  if (d.ready) {
    workerReady = true;
    return;
  }
  if (d.id && bridgePending[d.id]) {
    const cb = bridgePending[d.id];
    delete bridgePending[d.id];
    cb(d.result);
  }
}

function apiGet(action, data, callback) {
  if (!requireApi()) {
    if (callback) callback({ ok: false, found: false });
    return;
  }

  if (!bridgeListening) {
    window.addEventListener('message', onBridgeMessage);
    bridgeListening = true;
  }

  const id = 'b' + (++bridgeSeq);
  const timer = setTimeout(function() {
    if (!bridgePending[id]) return;
    delete bridgePending[id];
    if (action === 'HEALTH' || action === 'PING' || action === 'GET_RECORD') {
      if (callback) callback({ ok: false, found: false, message: 'timeout' });
      return;
    }
    note(
      'Drive save did not answer. Latest Code.gs Deploy New version karein. Title V64 LIVE SCAN hona chahiye.',
      'error'
    );
    if (callback) callback({ ok: false, found: false, message: 'timeout' });
  }, action === 'UPLOAD' ? 180000 : 25000);

  bridgePending[id] = function(result) {
    clearTimeout(timer);
    if (callback) callback(result);
  };

  const q = new URLSearchParams();
  q.set('bridge', '1');
  q.set('dpAction', action);
  q.set('rid', id);
  Object.keys(data || {}).forEach(function(k) {
    q.set(k, data[k] == null ? '' : String(data[k]));
  });

  if (bridgeFrame) bridgeFrame.remove();
  bridgeFrame = document.createElement('iframe');
  bridgeFrame.id = 'dpBridge';
  bridgeFrame.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;border:0';
  bridgeFrame.src = API_URL + '?' + q.toString();
  document.body.appendChild(bridgeFrame);
}

function clearResult() {
  $('result').style.display = 'none';
  $('result').innerHTML = '';
  $('empty').style.display = 'block';
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function js(v) {
  return JSON.stringify(String(v == null ? '' : v));
}

function setMode(next) {
  if (recorder && recorder.state === 'recording') {
    note('Recording active. Scan next AWB or press STOP & SAVE.', 'error');
    return;
  }
  mode = next;
  $('tabDispatch').classList.toggle('active', mode === 'DISPATCH');
  $('tabProof').classList.toggle('active', mode === 'PROOF');
  $('info').textContent = mode === 'DISPATCH'
    ? 'Dispatch: scan AWB → order details → recording starts automatically. Scan next AWB to save the previous video and continue.'
    : 'Proof: scan AWB → old Dispatch video opens here. Return video is made from this same tab.';
  clearResult();
  $('awb').focus();
}

async function refreshCameras() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      note('Camera API is unavailable in this browser.', 'error');
      return;
    }

    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    const select = $('cameraSelect');
    select.innerHTML = '';

    if (!cams.length) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = 'No camera detected';
      select.appendChild(o);
      $('cameraState').textContent = 'No camera found';
      return;
    }

    cams.forEach((c, i) => {
      const o = document.createElement('option');
      o.value = c.deviceId;
      o.textContent = c.label || ('Camera ' + (i + 1));
      select.appendChild(o);
    });

    if (selectedCameraId && cams.some(c => c.deviceId === selectedCameraId)) {
      select.value = selectedCameraId;
    } else {
      selectedCameraId = cams[0].deviceId;
      select.value = selectedCameraId;
      localStorage.setItem('DP50_CAMERA_ID', selectedCameraId);
    }

    $('cameraState').textContent = cams.length + ' camera(s) available';
  } catch (e) {
    note('Unable to list cameras: ' + (e.message || e), 'error');
  }
}

async function startCamera() {
  if (!window.isSecureContext) {
    throw new Error('Camera requires HTTPS. Open the published GitHub Pages URL, not a local file.');
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Camera API is unavailable in this browser.');
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  const id = $('cameraSelect').value || selectedCameraId;

  const videoConstraints = id
    ? {deviceId:{exact:id}, width:{ideal:960}, height:{ideal:540}}
    : {width:{ideal:960}, height:{ideal:540}, facingMode:{ideal:'environment'}};

  stream = await navigator.mediaDevices.getUserMedia({
    video: videoConstraints,
    audio: true
  });

  $('cameraFrame').srcObject = stream;
  $('cameraPanel').style.display = 'block';
  cameraReady = true;
  $('cameraState').textContent = 'Camera ready ✓';

  // Labels become available after permission.
  await refreshCameras();
}

function cameraError(e) {
  const n = e && e.name || '';
  if (n === 'NotAllowedError' || n === 'PermissionDeniedError')
    return 'Camera permission denied. Allow camera + microphone for this HTTPS page, then press TEST CAMERA again.';
  if (n === 'NotFoundError')
    return 'No camera was found on this device.';
  if (n === 'NotReadableError')
    return 'Camera is busy. Close other camera apps and retry.';
  if (n === 'OverconstrainedError')
    return 'Selected camera cannot use the requested settings. Choose another camera.';
  return e && e.message ? e.message : 'Unable to access camera.';
}

async function testCamera() {
  try {
    await startCamera();
    note('Camera ready ✓. Scan AWB to start recording.', 'ok');
  } catch (e) {
    note(cameraError(e), 'error');
  }
}

const SHEET_ID = '1E5VW0AjcECVcuVFx9geaCHfhbMtefA_ZUC8FB9kxqDs';
let awbColBySheet = {};

function indexToLetter(n) {
  let s = '';
  let i = n + 1;
  while (i > 0) {
    const r = (i - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function gvizQuery(sheetName, tq, timeoutMs) {
  const cb = 'DP50g' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  const url =
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?sheet=' + encodeURIComponent(sheetName) +
    '&headers=1&tq=' + encodeURIComponent(tq || 'select * limit 1') +
    '&tqx=' + encodeURIComponent('out:json;responseHandler:' + cb) +
    '&_ts=' + Date.now();

  return new Promise(function(resolve, reject) {
    const s = document.createElement('script');
    let finished = false;
    const timer = setTimeout(function() {
      if (finished) return;
      finished = true;
      try { delete window[cb]; } catch (e) { window[cb] = function() {}; }
      if (s.parentNode) s.remove();
      reject(new Error('Sheet lookup timed out'));
    }, timeoutMs || 25000);

    window[cb] = function(data) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e2) { window[cb] = function() {}; }
      if (s.parentNode) s.remove();
      resolve(data);
    };

    s.onerror = function() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e3) { window[cb] = function() {}; }
      if (s.parentNode) s.remove();
      reject(new Error('Sheet lookup failed'));
    };

    s.src = url;
    document.head.appendChild(s);
  });
}

function parseGviz(data) {
  if (!data || !data.table) return [];
  const cols = (data.table.cols || []).map(function(c) {
    return String(c.label || c.id || '').trim().toLowerCase();
  });
  return (data.table.rows || []).map(function(row) {
    const o = {};
    (row.c || []).forEach(function(cell, i) {
      const name = cols[i] || ('c' + i);
      if (!cell) {
        o[name] = '';
        return;
      }
      o[name] = cell.f != null && String(cell.f) !== ''
        ? String(cell.f)
        : (cell.v == null ? '' : String(cell.v));
    });
    return o;
  });
}

function normalizeAwb(v) {
  return String(v == null ? '' : v).replace(/[^\w]/g, '').toUpperCase();
}

function pickOrderRow(rows, awb) {
  const needle = normalizeAwb(awb);
  for (let i = rows.length - 1; i >= 0; i--) {
    const r = rows[i];
    const val = r['awb number'] || r['awb'] || r['awb no'] || r['awb no.'] || '';
    if (normalizeAwb(val) === needle) return r;
  }
  return null;
}

function rowToScanResult(r, awb, nextMode) {
  const status = r['live delivery status'] || r['status'] || '';
  const delivered = /^(delivered|successful|success|closed)$/i.test(String(status).trim());
  return {
    ok: true,
    found: true,
    date: r['date'] || '',
    orderId: r['order number'] || r['order id'] || r['order'] || '',
    awb: r['awb number'] || r['awb'] || awb,
    dispatchType: r['dispatch type'] || '',
    status: status,
    sku: r['itam sku'] || r['itam'] || r['sku'] || '',
    store: r['store'] || '',
    videoType: nextMode === 'PROOF' ? 'RETURN' : 'DISPATCH',
    terminal: nextMode !== 'PROOF' && delivered
  };
}

async function hasDispatchVideo(awb) {
  const needle = normalizeAwb(awb);
  if (savedAwbs[needle]) return true;
  try {
    const data = await gvizQuery(
      'VIDEO_PROOF',
      'select * where A = "' + needle + '" limit 8',
      8000
    );
    const rows = parseGviz(data);
    return rows.some(function(r) {
      const t = String(r['video type'] || r['videotype'] || '').toUpperCase();
      return t === 'DISPATCH';
    });
  } catch (e) {
    return false;
  }
}

async function lookupAwb(awb, nextMode) {
  const needle = normalizeAwb(awb);
  const tq = 'select A,B,C,E,G,H,I where C = "' + needle + '" or C = ' + needle + ' limit 5';
  const sheets = ['Order', 'Closed'];
  for (let s = 0; s < sheets.length; s++) {
    try {
      const data = await gvizQuery(sheets[s], tq, 25000);
      const row = pickOrderRow(parseGviz(data), awb);
      if (row) {
        const res = rowToScanResult(row, awb, nextMode);
        if (nextMode !== 'PROOF' && await hasDispatchVideo(needle)) {
          res.duplicate = true;
        }
        return res;
      }
    } catch (ignore) {}
  }
  return { found: false, message: 'AWB not found: ' + needle };
}

function jsonpCall(action, data, timeoutMs) {
  return new Promise(function(resolve, reject) {
    if (!API_URL) {
      reject(new Error('No API'));
      return;
    }
    const cb = 'DP50j' + (++bridgeSeq) + '_' + Date.now();
    const q = new URLSearchParams();
    q.set('dpAction', action);
    q.set('callback', cb);
    q.set('transport', 'jsonp');
    Object.keys(data || {}).forEach(function(k) {
      q.set(k, data[k] == null ? '' : String(data[k]));
    });
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(function() {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error(action + ' timeout'));
    }, timeoutMs || 12000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = function() {}; }
      if (s.parentNode) s.remove();
    }
    window[cb] = function(res) {
      if (done) return;
      done = true;
      cleanup();
      resolve(res);
    };
    s.onerror = function() {
      /* Google /exec redirect often fires onerror; callback may still run. */
    };
    s.src = API_URL + '?' + q.toString();
    document.head.appendChild(s);
  });
}

function lookupFast(awb) {
  if (API_URL) {
    return jsonpCall('SCAN', {awb: awb, mode: mode}, 12000).catch(function() {
      return new Promise(function(resolve, reject) {
        apiGet('SCAN', {awb: awb, mode: mode}, function(r) {
          if (r) resolve(r);
          else reject(new Error('AWB lookup failed'));
        });
      });
    });
  }
  return lookupAwb(awb, mode);
}

function scan() {
  const v = $('awb').value.trim();
  if (!v) {
    note('Please scan AWB.', 'error');
    return;
  }

  if (mode === 'DISPATCH' && recorder && recorder.state === 'recording' &&
      currentSession && normalizeAwb(currentSession.awb) === normalizeAwb(v)) {
    stopRecording();
    note('Wahi AWB. Recording save ho rahi hai…', 'ok');
    return;
  }

  if (mode === 'DISPATCH' && recorder && recorder.state === 'recording') {
    note('Pehli video save ho rahi hai, naya AWB check…', 'ok');
    stopRecording();
  }

  note('AWB check… 10-15 sec lag sakte hain', 'ok');
  lookupAwb(v, mode).then(handleScan).catch(function(err) {
    note(err && err.message ? err.message : 'AWB lookup failed.', 'error');
  });
}

function kickWaitingOrder() {
  if (recorder && recorder.state === 'recording') return;
  if (!waitingOrder) return;
  const r = waitingOrder;
  waitingOrder = null;
  handleScan(r);
}

function handleScan(r) {
  if (!r || !r.found) {
    note(r && r.message ? r.message : 'AWB not found.', 'error');
    return;
  }

  if (r.terminal) {
    clearResult();
    $('empty').style.display = 'none';
    note('This Order ID is already delivered successfully. No video proof is required.', 'terminal');
    $('awb').value = '';
    $('awb').focus();
    return;
  }

  if (r.duplicate && mode === 'DISPATCH') {
    showDispatch(r);
    note('DUPLICATE AWB FOUND. Is AWB ki video pehle se save hai. Dobara record nahi hoga.', 'error');
    $('awb').value = '';
    $('awb').focus();
    return;
  }

  if (mode === 'DISPATCH') {
    if (recorder && recorder.state === 'recording') {
      waitingOrder = r;
      stopRecording();
      return;
    }
    showDispatch(r);
    startRecording(r);
    return;
  }

  showProof(r);
}

function showDispatch(r) {
  $('empty').style.display = 'none';
  $('result').innerHTML =
    '<div class="grid">' +
      '<div><div class="label">DATE</div><div class="value">' + esc(r.date) + '</div></div>' +
      '<div><div class="label">ORDER ID</div><div class="value">' + esc(r.orderId) + '</div></div>' +
      '<div><div class="label">AWB</div><div class="value">' + esc(r.awb) + '</div></div>' +
      '<div><div class="label">DISPATCH TYPE</div><div class="value">' + esc(r.dispatchType) + '</div></div>' +
    '</div>' +
    '<div style="margin-top:8px" class="' + (r.duplicate ? 'required' : 'ready') + '">' +
      (r.duplicate
        ? '● DUPLICATE — VIDEO ALREADY SAVED'
        : '● RECORDING STARTS AUTOMATICALLY AFTER AWB VERIFICATION') +
    '</div>';
  $('result').style.display = 'block';
}

function videoBox(title, rec) {
  if (!rec) return '';
  const preview = rec.previewUrl || rec.url || '';
  const src = rec.downloadUrl || '';
  return (
    '<div class="videoBox">' +
      '<div style="font-weight:800;margin-bottom:6px">' + esc(title) + '</div>' +
      (preview
        ? '<iframe class="proofVideo" src="' + esc(preview) + '" allow="autoplay" allowfullscreen></iframe>'
        : '<video class="proofVideo" controls playsinline src="' + esc(src) + '"></video>') +
      '<div class="controls">' +
        '<button class="primary small" onclick="downloadFile(' + js(rec.fileId) + ')">⬇ DOWNLOAD</button>' +
        '<button class="green small" onclick="shareFile(' + js(rec.fileId) + ')">↗ SHARE</button>' +
      '</div>' +
    '</div>'
  );
}

function showProof(r) {
  $('empty').style.display = 'none';

  let html =
    '<div class="grid">' +
      '<div><div class="label">ORDER ID</div><div class="value">' + esc(r.orderId) + '</div></div>' +
      '<div><div class="label">AWB</div><div class="value">' + esc(r.awb) + '</div></div>' +
      '<div><div class="label">LIVE STATUS</div><div class="value">' + esc(r.status || '') + '</div></div>' +
      '<div><div class="label">DISPATCH VIDEO</div><div class="value ' + (r.dispatchVideo ? 'ready' : 'required') + '">' +
        (r.dispatchVideo ? 'VIDEO READY' : 'NOT AVAILABLE') +
      '</div></div>' +
    '</div>';

  if (r.dispatchVideo) {
    html += videoBox('DISPATCH VIDEO', r.dispatchVideo);
  } else {
    html += '<div style="margin-top:9px" class="required">Is AWB ki dispatch video abhi Drive index mein nahi mili. Pehle MAKE DISPATCH VIDEO tab se record karke STOP & SAVE karein.</div>';
  }

  if (r.returnVideo) {
    html += videoBox('RETURN VIDEO • READY', r.returnVideo);
  } else {
    html +=
      '<div style="margin-top:9px">' +
        '<span class="required">RETURN VIDEO REQUIRED</span> ' +
        '<button class="orange" onclick="startReturnRecording(' +
          js(r.awb) + ',' + js(r.orderId) + ',' + js(r.status) +
        ')">MAKE RETURN VIDEO</button>' +
      '</div>';
  }

  $('result').innerHTML = html;
  $('result').style.display = 'block';
}

function chooseMime() {
  const types = [
    'video/mp4;codecs=avc1.42001E,mp4a.40.2',
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=h264,opus',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];

  for (const t of types) {
    if (window.MediaRecorder &&
        MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(t)) {
      return t;
    }
  }
  return '';
}

function fileExtForMime(mime) {
  return /mp4/i.test(String(mime || '')) ? '.mp4' : '.webm';
}

async function startRecording(r) {
  if (!r) return;

  if (!cameraReady) {
    try {
      await startCamera();
    } catch (e) {
      note(cameraError(e), 'error');
      return;
    }
  }

  if (recorder && recorder.state === 'recording') return;

  const mime = chooseMime();
  recorderMime = mime;

  try {
    recorder = mime
      ? new MediaRecorder(stream, {
          mimeType:mime,
          videoBitsPerSecond:220000,
          audioBitsPerSecond:24000
        })
      : new MediaRecorder(stream);
  } catch (e) {
    note('Unable to start recorder: ' + (e.message || e), 'error');
    return;
  }

  currentSession = {
    awb:String(r.awb || ''),
    orderId:String(r.orderId || ''),
    status:String(r.status || ''),
    videoType:String(r.videoType || mode || 'DISPATCH').toUpperCase()
  };

  chunks = [];
  recorder.ondataavailable = e => {
    if (e.data && e.data.size) chunks.push(e.data);
  };

  recorder.onerror = () => note('Recorder error.', 'error');
  recorder.onstop = finishRecording;

  recorder.start(1000);
  recordStartedAt = Date.now();

  $('cameraPanel').style.display = 'block';
  $('cameraLabel').textContent =
    currentSession.videoType === 'RETURN'
      ? 'MAKE RETURN VIDEO'
      : 'MAKE DISPATCH VIDEO';
  $('live').style.display = 'inline';
  $('timer').textContent = '00:00';
  updateTimer();

  note('● RECORDING STARTED • Scan next AWB to auto-save and continue.', 'ok');
  $('awb').value = '';
  $('awb').focus();
}

function updateTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (!recorder || recorder.state !== 'recording') return;
    const sec = Math.floor((Date.now() - recordStartedAt) / 1000);
    $('timer').textContent =
      String(Math.floor(sec / 60)).padStart(2,'0') + ':' +
      String(sec % 60).padStart(2,'0');
  }, 250);
}

function stopRecording() {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
  }
}

function stopManual() {
  nextOrder = null;
  stopRecording();
  note('Stopping recording. Video is being saved in the background...', 'ok');
}

function finishRecording() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }

  $('live').style.display = 'none';
  $('timer').textContent = '00:00';
  $('cameraLabel').textContent = 'CAMERA READY';

  const s = currentSession;
  const savedChunks = chunks.slice();

  currentSession = null;
  chunks = [];
  recorder = null;

  if (!s || !savedChunks.length) {
    note('VIDEO SAVE ERROR: recorded video is empty.', 'error');
    kickWaitingOrder();
    return;
  }

  const mime = savedChunks[0].type || recorderMime || 'video/mp4';
  const blob = new Blob(savedChunks, {type:mime});

  if (!blob.size) {
    note('VIDEO SAVE ERROR: recorded video is empty.', 'error');
    kickWaitingOrder();
    return;
  }

  // Keep enough headroom under Apps Script request limits.
  if (blob.size > 18 * 1024 * 1024) {
    note('VIDEO TOO LARGE. Keep each recording below 18 MB.', 'error');
    kickWaitingOrder();
    return;
  }

  queueUpload(s, blob);

  const queued = nextOrder;
  nextOrder = null;
  if (queued) startRecording(queued);
  else kickWaitingOrder();
}

function queueUpload(s, blob) {
  uploadQueue++;
  note('Saving AWB ' + s.awb + ' in background…', 'ok');

  const reader = new FileReader();

  reader.onerror = () => {
    uploadQueue--;
    note('VIDEO SAVE ERROR: unable to read recorded video.', 'error');
  };

  reader.onload = () => {
    try {
      const dataUrl = String(reader.result || '');
      const comma = dataUrl.indexOf(',');
      const base64 = comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;

      const payload = {
        awb:s.awb,
        orderId:s.orderId,
        status:s.status,
        videoType:s.videoType,
        fileName:(s.awb || 'VIDEO') + '_' + s.videoType + '_' + Date.now() + fileExtForMime(blob.type),
        mimeType:blob.type || 'video/mp4',
        base64:base64
      };

      submitUpload(payload);
    } catch (e) {
      uploadQueue--;
      note('VIDEO SAVE ERROR: ' + (e.message || e), 'error');
    }
  };

  reader.readAsDataURL(blob);
}

function bootWorker() {
  if (!API_URL) return;
  if (!bridgeListening) {
    window.addEventListener('message', onBridgeMessage);
    bridgeListening = true;
  }
  if (!workerWin || workerWin.closed) {
    workerWin = window.open(API_URL + '?bridge=1', 'DP_DRIVE_WORKER', 'width=140,height=90,left=0,top=0');
  }
  if (!workerFrame) {
    workerFrame = document.createElement('iframe');
    workerFrame.id = 'dpWorker';
    workerFrame.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;border:0';
    workerFrame.src = API_URL + '?bridge=1';
    document.body.appendChild(workerFrame);
  }
}

function workerTarget() {
  if (workerWin && !workerWin.closed) return workerWin;
  if (workerFrame && workerFrame.contentWindow) return workerFrame.contentWindow;
  return null;
}

function ensureWorker() {
  return new Promise(function(resolve, reject) {
    if (workerReady && workerTarget()) {
      resolve();
      return;
    }
    bootWorker();
    let n = 0;
    const t = setInterval(function() {
      if (workerReady && workerTarget()) {
        clearInterval(t);
        resolve();
      } else if (++n > 80) {
        clearInterval(t);
        reject(new Error('Drive worker did not start. Scan ke time chhota Drive window allow karein, phir Code.gs Deploy New version karein.'));
      }
    }, 200);
  });
}

function workerCall(action, payload, timeoutMs) {
  return new Promise(function(resolve, reject) {
    ensureWorker().then(function() {
      const target = workerTarget();
      if (!target) {
        reject(new Error('Drive worker window band ho gayi.'));
        return;
      }
      const id = 'w' + (++bridgeSeq);
      const timer = setTimeout(function() {
        if (!bridgePending[id]) return;
        delete bridgePending[id];
        reject(new Error('Drive save timeout on ' + action));
      }, timeoutMs || 45000);
      bridgePending[id] = function(result) {
        clearTimeout(timer);
        if (result && result.ok === false && action !== 'SCAN' && action !== 'GET_RECORD') {
          reject(new Error(result.message || 'save failed'));
          return;
        }
        resolve(result);
      };
      target.postMessage({
        dp: 1,
        id: id,
        action: action,
        payload: payload
      }, '*');
    }).catch(reject);
  });
}

function formPost(fields, waitMs) {
  return new Promise(function(resolve) {
    const name = 'DPF' + (++bridgeSeq);
    const iframe = document.createElement('iframe');
    iframe.name = name;
    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;border:0';
    document.body.appendChild(iframe);
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = API_URL;
    form.target = name;
    form.acceptCharset = 'UTF-8';
    form.style.display = 'none';
    Object.keys(fields).forEach(function(k) {
      const area = document.createElement('textarea');
      area.name = k;
      area.value = fields[k] == null ? '' : String(fields[k]);
      form.appendChild(area);
    });
    document.body.appendChild(form);
    form.submit();
    setTimeout(function() {
      form.remove();
      iframe.remove();
      resolve({ ok: true });
    }, waitMs || 700);
  });
}

function submitUpload(payload) {
  if (!API_URL) {
    uploadQueue = Math.max(0, uploadQueue - 1);
    note('Drive save ke liye camera Google Sheet se kholo: DISPATCH CAMERA → Open camera.', 'error');
    return;
  }

  const raw = String(payload.base64 || '');
  if (!raw) {
    uploadQueue = Math.max(0, uploadQueue - 1);
    note('VIDEO SAVE ERROR: empty video data.', 'error');
    return;
  }

  (async function() {
    try {
      const size = 28000;
      const total = Math.ceil(raw.length / size);
      const uploadId = 'u' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      const parallel = 3;
      for (let i = 0; i < total; i += parallel) {
        const batch = [];
        for (let j = 0; j < parallel && i + j < total; j++) {
          const idx = i + j;
          note('Drive par save ho raha hai… ' + (idx + 1) + '/' + total, 'ok');
          batch.push(formPost({
            phase: 'chunk',
            uploadId: uploadId,
            index: String(idx),
            data: raw.slice(idx * size, (idx + 1) * size)
          }, 750));
        }
        await Promise.all(batch);
      }
      note('Video Drive par finish ho rahi hai • AWB ' + payload.awb, 'ok');
      await formPost({
        phase: 'finish',
        uploadId: uploadId,
        total: String(total),
        awb: payload.awb || '',
        orderId: payload.orderId || '',
        videoType: payload.videoType || 'DISPATCH',
        mimeType: payload.mimeType || 'video/mp4',
        fileName: payload.fileName || ''
      }, 2800);
      pollSaved(payload.awb, payload.videoType || 'DISPATCH', 0);
    } catch (err) {
      uploadQueue = Math.max(0, uploadQueue - 1);
      note('VIDEO SAVE ERROR: ' + (err.message || err), 'error');
    }
  })();
}

function pollSaved(awb, type, attempt) {
  if (attempt >= 12) {
    uploadQueue = Math.max(0, uploadQueue - 1);
    note('Save request chali. Google Sheet tab VIDEO_PROOF aur Drive folder check karein.', 'ok');
    return;
  }

  setTimeout(function() {
    hasDispatchVideo(awb).then(function(ok) {
      if (ok) {
        uploadQueue = Math.max(0, uploadQueue - 1);
        savedAwbs[normalizeAwb(awb)] = true;
        lastSaved = { awb: awb, videoType: type, found: true };
        note('✓ VIDEO SAVED • ' + awb, 'ok');
        return;
      }
      pollSaved(awb, type, attempt + 1);
    });
  }, 1000);
}

async function startReturnRecording(awb, orderId, status) {
  if (recorder && recorder.state === 'recording') {
    note('A recording is already active. Stop & Save first.', 'error');
    return;
  }

  await startRecording({
    awb:String(awb),
    orderId:String(orderId || ''),
    status:String(status || ''),
    videoType:'RETURN'
  });
}

function downloadFile(id) {
  apiGet('DOWNLOAD', {fileId:id}, r => {
    if (r && r.ok && r.url) {
      window.open(r.url, '_blank', 'noopener');
    } else {
      note(r && r.message ? r.message : 'Download link unavailable.', 'error');
    }
  });
}

function shareFile(id) {
  apiGet('SHARE', {fileId:id}, r => {
    if (!r || !r.ok) {
      note(r && r.message ? r.message : 'Share link unavailable.', 'error');
      return;
    }

    if (navigator.share) {
      navigator.share({title:'Video Proof', url:r.url}).catch(()=>{});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(r.url)
        .then(() => note('Share link copied.', 'ok'))
        .catch(() => window.prompt('Copy share link:', r.url));
    } else {
      window.prompt('Copy share link:', r.url);
    }
  });
}

$('tabDispatch').addEventListener('click', () => setMode('DISPATCH'));
$('tabProof').addEventListener('click', () => setMode('PROOF'));

$('refreshCamera').addEventListener('click', refreshCameras);
$('testCamera').addEventListener('click', testCamera);
$('scanBtn').addEventListener('click', scan);
$('refreshBtn').addEventListener('click', () => {
  if (recorder && recorder.state === 'recording') {
    note('Recording is active. Scan next AWB or press STOP & SAVE.', 'error');
    return;
  }
  $('awb').value = '';
  clearResult();
  note('Cleared — ready for the next AWB scan.', 'ok');
  $('awb').focus();
});

$('stopBtn').addEventListener('click', stopManual);

$('awb').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    scan();
  }
});

$('cameraSelect').addEventListener('change', async function() {
  selectedCameraId = this.value;
  localStorage.setItem('DP50_CAMERA_ID', selectedCameraId);

  if (stream && !(recorder && recorder.state === 'recording')) {
    try {
      await startCamera();
    } catch (e) {
      note(cameraError(e), 'error');
    }
  }
});

window.addEventListener('beforeunload', e => {
  if (recorder && recorder.state === 'recording') {
    e.preventDefault();
    e.returnValue = 'Recording is active.';
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
});

(async function init() {
  if (API_URL) {
    $('cameraState').textContent = 'Drive save ready ✓';
  } else {
    note('Scan works from the Order sheet. To save video to Drive, open camera from Google Sheet → DISPATCH CAMERA → Open camera.', 'ok');
  }

  await refreshCameras();
  $('awb').focus();
})();
</script>
