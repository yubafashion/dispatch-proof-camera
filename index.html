<div class="compactHead"><div class="compactTitle">🎥 DISPATCH PROOF MANAGEMENT</div><div class="compactAg">AG</div></div><div class="tabs"><div id="td" class="tab active" onclick="setMode('DISPATCH')">🎥 MAKE DISPATCH VIDEO</div><div id="tp" class="tab" onclick="setMode('PROOF')">🎥 VIDEO PROOF</div></div>
<div class="tools"><b style="font-size:11px">CAMERA</b><select id="cameraSelect"></select><button class="gray" onclick="refreshCameras()">REFRESH CAMERA</button><button class="primary" onclick="testCamera()">TEST CAMERA</button><span id="cameraState" class="status">Camera not started</span></div>
<div class="scan"><input id="awb" autofocus autocomplete="off" placeholder="SCAN AWB BARCODE..." onkeydown="if(event.key==='Enter')scan()" oninput="handleAwbInput(this)"><button class="primary" onclick="scan()">SCAN</button><button class="gray" onclick="refreshCurrent()">REFRESH</button></div>
<div class="main"><div id="notice" class="notice"></div><div id="rec" class="rec"><div class="rh"><div><b id="recTitle"></b><div id="recMeta"></div></div><div><div class="live">● RECORDING</div><div id="timer" class="timer">00:00</div></div></div><video id="camera" autoplay muted playsinline></video><div class="controls"><button class="red" onclick="stopManual()">■ STOP & SAVE</button></div></div>
<div id="info" class="info">Scan one AWB. Nothing else is loaded.</div><div id="result" class="card"></div><div id="empty" class="empty">SCAN AWB TO LOAD ONLY THAT ORDER</div></div>
<script>
let mode='DISPATCH',stream=null,recorder=null,chunks=[],session=null,nextOrder=null,startAt=0,timer=null,currentFile=null,lastScannedAwb='',selectedCameraId=localStorage.getItem('DP21_CAMERA_ID')||'';
function note(t,terminal){const e=document.getElementById('notice');e.textContent=t||'';e.classList.toggle('terminal',!!terminal);e.style.display=t?'flex':'none'}
function setMode(m){if(recorder&&recorder.state==='recording'){note('Recording active. Scan next AWB or press STOP & SAVE.');return}mode=m;td.classList.toggle('active',m==='DISPATCH');tp.classList.toggle('active',m==='PROOF');info.textContent=m==='DISPATCH'?'Dispatch: scan AWB → Order ID/Date/Dispatch Type → recording starts automatically. Scan next AWB to auto-save and continue.':'Proof: scan AWB → Dispatch Video is shown. If a problem status exists, Make Return Video is available.';clearResult();awb.focus()}
function clearResult(){result.style.display='none';result.innerHTML='';empty.style.display='block'}
function handleAwbInput(el){if(!el.value.trim() && !(recorder&&recorder.state==='recording')){lastScannedAwb='';clearResult();note('Ready — scan an AWB.')}}
function minimizeWindow(){if(recorder&&recorder.state==='recording'){note('Recording is active. Stop & Save before minimizing.');return}google.script.run.withSuccessHandler(function(){google.script.host.close()}).DP21_OPEN_COMPACT()}
function scan(){
  const v=awb.value.trim();
  if(!v){note('Please scan AWB.');return}
  lastScannedAwb=v;

  /*
   * V26 TWO-MODE FLOW:
   * 1) On the user's AWB scan, open/reuse ONE TEST bridge window immediately.
   * 2) TEST mode only opens the live camera while the AWB is being looked up.
   * 3) After the Apps Script lookup returns the real Order ID, the same bridge
   *    window is navigated to RECORD+AUTOSTART so recording starts deterministically.
   * 4) Next AWB while recording => STOP_RECORDING first. VIDEO_READY saves the
   *    current AWB, then the queued AWB starts automatically.
   * 5) STOP & SAVE => current AWB is saved and the camera remains ready. The
   *    next AWB starts a fresh recording in the same bridge window.
   *
   * The camera window is reserved as a blank popup during the scan gesture.
   * After AWB lookup succeeds, that same window is navigated directly to
   * RECORD+AUTOSTART. Normal AWB flow never opens TEST mode.
   */
  if(mode==='DISPATCH' && !bridgeRecording){
    if(!cameraWindow || cameraWindow.closed){
      bridgeSession={awb:String(v),orderId:'',status:'',videoType:'DISPATCH',pendingLookup:true};
      const w=reserveCameraWindow_();
      if(!w){
        bridgeSession=null;
        return;
      }
      cameraState.textContent='Camera window reserved — fetching AWB...';
      note('AWB scanned. Looking up AWB before starting recording...');
    }else{
      bridgeSession={awb:String(v),orderId:'',status:'',videoType:'DISPATCH',pendingLookup:true};
      bridgeTest=false;
      note('AWB scanned — looking up AWB before starting recording...');
      try{cameraWindow.focus()}catch(e){}
    }
  }

  google.script.run.withSuccessHandler(handleScan).withFailureHandler(function(e){
    note(e&&e.message?e.message:String(e),true);
  }).DP21_scanAWB(v,mode);
}
function refreshCurrent(){
  if(recorder&&recorder.state==='recording'){note('Recording is active. Scan next AWB or press STOP & SAVE.');return}
  lastScannedAwb='';
  awb.value='';
  clearResult();
  note('Cleared — ready for the next AWB scan.');
  awb.focus();
}
function handleScan(r){
  if(!r||!r.found){
    if(bridgeSession && String(bridgeSession.awb)===String(lastScannedAwb) && !bridgeRecording){
      bridgeSession=null;
      pendingBridgeStart=null;
      note(r&&r.message?r.message:'AWB not found.',true);
      return;
    }
    note(r&&r.message?r.message:'AWB not found.',true);
    return;
  }

  if(r.terminal){
    if(bridgeSession && String(bridgeSession.awb)===String(r.awb) && bridgeRecording){
      note('Cannot cancel an active recording automatically. Press STOP & SAVE first.',true);
      return;
    }
    try{if(cameraWindow&&!cameraWindow.closed&&!bridgeRecording)cameraWindow.close()}catch(e){}
    cameraWindow=null; bridgeSession=null; bridgeReady=false; bridgeTest=false; pendingBridgeStart=null;
    clearResult();
    empty.style.display='none';
    note('This Order ID is already delivered successfully. No video proof is required.', true);
    awb.value=''; awb.focus();
    return;
  }

  if(mode==='DISPATCH'){
    /* First/new AWB: lookup is complete, so start recording in the SAME
     * camera window that was opened by the scan gesture. */
    if(bridgeSession && String(bridgeSession.awb)===String(r.awb) && bridgeSession.pendingLookup){
      bridgeSession.orderId=String(r.orderId||'');
      bridgeSession.status=String(r.status||'');
      bridgeSession.videoType='DISPATCH';
      bridgeSession.pendingLookup=false;
      showScanned(r);
      awb.value=''; awb.focus();

      if(cameraWindow && !cameraWindow.closed){
        beginBridgeRecording_(bridgeSession);
      }else{
        note('Camera window is not available. Please allow pop-ups and scan again.',true);
      }
      return;
    }

    /* A different AWB was scanned while an existing recording is active. */
    if(bridgeRecording){
      nextOrder=r;
      note('Saving previous AWB before starting the new AWB...');
      stopRecording();
      return;
    }

    /* Fallback for Return Video or any session without a pending scan lookup. */
    showScanned(r);
    startRecording(r);
    return;
  }

  showProofScanned(r);
}
function showScanned(r){
  empty.style.display='none';
  let html='<div class=\"grid\"><div><div class=\"label\">DATE</div><div class=\"value\">'+esc(r.date||'')+'</div></div><div><div class=\"label\">ORDER ID</div><div class=\"value\">'+esc(r.orderId)+'</div></div><div><div class=\"label\">AWB</div><div class=\"value\">'+esc(r.awb)+'</div></div><div><div class=\"label\">DISPATCH TYPE</div><div class=\"value\">'+esc(r.dispatchType||'')+'</div></div></div>';
  const active = !!bridgeRecording && bridgeSession && String(bridgeSession.awb)===String(r.awb);
  html+='<div style="margin-top:8px" class="'+(active?'ready':'required')+'">'+(active?'● VIDEO RECORDING ACTIVE':'● WAITING FOR ACTUAL RECORDING START')+'</div>';
  showCard(html);
}

function showProofScanned(r){
  empty.style.display='none';
  let html='<div class=\"grid\"><div><div class=\"label\">ORDER ID</div><div class=\"value\">'+esc(r.orderId)+'</div></div><div><div class=\"label\">AWB</div><div class=\"value\">'+esc(r.awb)+'</div></div><div><div class=\"label\">LIVE STATUS</div><div class=\"value\">'+esc(r.status||'')+'</div></div><div><div class=\"label\">DISPATCH VIDEO</div><div class=\"value '+(r.dispatchVideo?'ready':'required')+'">'+(r.dispatchVideo?'VIDEO READY':'NOT AVAILABLE')+'</div></div></div>';
  if(r.dispatchVideo){
    html+='<div class=\"videoBox\"><div style=\"font-weight:700;margin-bottom:6px\">DISPATCH VIDEO</div><video controls playsinline src=\"'+esc(r.dispatchVideo.downloadUrl)+'\"></video><div class=\"controls\"><button class=\"primary\" onclick=\"downloadFile('+js(r.dispatchVideo.fileId)+')\">⬇ DOWNLOAD</button><button class=\"green\" onclick=\"shareFile('+js(r.dispatchVideo.fileId)+')\">↗ SHARE</button></div></div>';
  }
  if(r.returnVideo){
    html+='<div class=\"videoBox\"><div style=\"font-weight:700;margin-bottom:6px\">RETURN VIDEO • READY</div><video controls playsinline src=\"'+esc(r.returnVideo.downloadUrl)+'\"></video><div class=\"controls\"><button class=\"primary\" onclick=\"downloadFile('+js(r.returnVideo.fileId)+')\">⬇ DOWNLOAD</button><button class=\"green\" onclick=\"shareFile('+js(r.returnVideo.fileId)+')\">↗ SHARE</button></div></div>';
  } else {
    html+='<div style=\"margin-top:9px\"><span class=\"required\">RETURN VIDEO REQUIRED</span> <button class=\"orange\" onclick=\"startReturnRecording('+js(r.awb)+','+js(r.orderId)+','+js(r.status)+')\">MAKE RETURN VIDEO</button></div>';
  }
  showCard(html);
}

async function startReturnRecording(awbValue,orderId,status){
  if(recorder&&recorder.state==='recording'){note('A recording is already active. Stop & Save first.');return}
  const r={awb:String(awbValue),orderId:String(orderId||''),status:String(status||''),videoType:'RETURN'};
  await startRecording(r);
}

function showCard(html){result.innerHTML=html;result.style.display='block'}

let cameraWindow=null;
let preopenedCameraWindow=null;
let bridgeSession=null;
let recordingStartedAt=0;
let parentTimer=null;
let bridgeReady=false;
let bridgeRecording=false;
let bridgeTest=false;
let bridgeNavigating=false;
let pendingBridgeStart=null;
let recordingStartWatchdog=null;

/*
 * Camera is intentionally NOT opened inside the Apps Script iframe.
 * The external HTTPS bridge owns getUserMedia()/MediaRecorder and sends
 * the resulting Blob back with postMessage.
 */
function bridgeUrl_(mode, r, autostart){
  const base = 'https://yubafashion.github.io/dispatch-proof-camera/';
  const u = new URL(base);
  u.searchParams.set('mode', String(mode||'TEST').toUpperCase());
  if(autostart) u.searchParams.set('autostart','1');
  if(r){
    u.searchParams.set('awb', String(r.awb||''));
    u.searchParams.set('orderId', String(r.orderId||''));
    u.searchParams.set('status', String(r.status||''));
    u.searchParams.set('videoType', String(r.videoType||''));
  }
  u.searchParams.set('ts', String(Date.now()));
  u.searchParams.set('bridgeVersion', 'V26_TWO_MODE_AUTO_SAVE_20260825');
  u.searchParams.set('session', Math.random().toString(36).slice(2));
  return u.toString();
}

function reserveCameraWindow_(){
  let w=null;
  try{
    w=window.open('about:blank','DISPATCH_PROOF_CAMERA_'+Date.now(),'popup=yes,width=760,height=680,resizable=yes,scrollbars=no');
  }catch(e){w=null}
  if(!w){
    note('Camera window was blocked by the browser. Allow pop-ups for this spreadsheet.');
    return null;
  }
  cameraWindow=w;
  preopenedCameraWindow=w;
  bridgeReady=false;
  bridgeRecording=false;
  bridgeTest=false;
  bridgeNavigating=true;
  try{w.focus()}catch(e){}
  return w;
}

function openBridge(mode, r, existingWindow, autostart){
  const url = bridgeUrl_(mode, r||{}, !!autostart);
  let w=existingWindow||null;

  // Prefer a window that was opened synchronously from the user's scan/click.
  // This avoids Chrome's popup-blocking of window.open() from google.script.run callbacks.
  if(w&&!w.closed){
    try{
      bridgeNavigating=true;
      w.location.replace(url);
      w.focus();
    }catch(e){
      try{w.location.href=url}catch(x){w=null}
    }
  }

  if(!w){
    try{
      w = window.open(
        url,
        'DISPATCH_PROOF_CAMERA_'+Date.now(),
        'popup=yes,width=760,height=680,resizable=yes,scrollbars=no'
      );
      bridgeNavigating=false;
    }catch(e){w=null}
  }

  if(!w){
    note('Camera window was blocked by the browser. Allow pop-ups for this spreadsheet.');
    return null;
  }
  cameraWindow=w;
  preopenedCameraWindow=null;
  bridgeReady=false;
  if(!w || w.closed) bridgeNavigating=false;
  bridgeTest=(String(mode||'').toUpperCase()==='TEST');
  return w;
}

window.addEventListener('message', function(event){
  const d=event.data||{};
  if(!d || d.source!=='DISPATCH_PROOF_CAMERA_BRIDGE') return;

  if(d.type==='BRIDGE_READY'){
    bridgeNavigating=false;
    bridgeReady=true;
    cameraState.textContent='Camera bridge ready ✓';
    if(pendingBridgeStart && !bridgeRecording) beginBridgeRecording_(pendingBridgeStart);
    return;
  }

  if(d.type==='CAMERA_READY'){
    bridgeNavigating=false;
    bridgeReady=true;
    cameraState.textContent='Camera ready ✓';
    if(bridgeTest) note('Camera test successful. Live webcam is open in the camera window.');
    if(pendingBridgeStart && !bridgeRecording) beginBridgeRecording_(pendingBridgeStart);
    return;
  }

  if(d.type==='CAMERA_ERROR'){
    if(recordingStartWatchdog){clearTimeout(recordingStartWatchdog);recordingStartWatchdog=null;}
    bridgeReady=false;
    bridgeRecording=false;
    cameraState.textContent='Camera error';
    note('Camera error: '+String(d.message||'Unknown camera error'));
    return;
  }

  if(d.type==='RECORDING_STARTED'){
    if(!bridgeSession){
      // Ignore stale/early bridge messages. V18 requires a parent session
      // before any recording can become active.
      return;
    }
    if(d.awb && String(d.awb)!==String(bridgeSession.awb)){
      return;
    }
    if(recordingStartWatchdog){clearTimeout(recordingStartWatchdog);recordingStartWatchdog=null;}
    bridgeRecording=true;
    cameraState.textContent='Camera recording ✓';
    rec.style.display='block';
    recTitle.textContent=(bridgeSession&&bridgeSession.videoType==='RETURN')
      ? 'MAKE RETURN VIDEO'
      : 'MAKE DISPATCH VIDEO';
    recMeta.innerHTML='<b>Order ID:</b> '+esc(bridgeSession&&bridgeSession.orderId||'')+
      '<br><b>AWB:</b> '+esc(bridgeSession&&bridgeSession.awb||'');
    recordingStartedAt=Date.now();
    timer.textContent='00:00';
    if(parentTimer)clearInterval(parentTimer);
    parentTimer=setInterval(function(){
      if(!bridgeRecording)return;
      const sec=Math.floor((Date.now()-recordingStartedAt)/1000);
      timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
    },250);
    note('● RECORDING STARTED • Scan next AWB to auto-save.');
    try{
      if(String(lastScannedAwb||'')===String(bridgeSession.awb||'')){
        const statusEl=document.querySelector('#result .ready, #result .required');
        if(statusEl){statusEl.className='ready';statusEl.textContent='● VIDEO RECORDING ACTIVE';}
      }
    }catch(e){}
    return;
  }

  if(d.type==='VIDEO_READY'){
    bridgeRecording=false;
    if(parentTimer){clearInterval(parentTimer);parentTimer=null;}
    timer.textContent='00:00';
    cameraState.textContent='Camera ready ✓';

    const s=bridgeSession;
    bridgeSession=null;

    if(!d.blob){
      note('Camera bridge returned no video data.');
      return;
    }

    saveRecordingFromBridge(
      s,
      d.blob,
      d.fileName || ((s&&s.awb)||'VIDEO')+'_'+((s&&s.videoType)||'DISPATCH')+'.webm'
    );
    return;
  }

  if(d.type==='BRIDGE_CLOSED'){
    /* A TEST -> RECORD navigation intentionally unloads the old bridge page.
     * Do not mistake that unload for the user closing the camera window. */
    if(bridgeNavigating){
      bridgeReady=false;
      return;
    }
    cameraWindow=null;
    bridgeReady=false;
    if(bridgeRecording){
      bridgeRecording=false;
      note('Camera window was closed while recording. No video was saved.');
    }
    return;
  }
});

function closeIdleBridge_(){
  if(cameraWindow&&!cameraWindow.closed&&!bridgeRecording){
    try{cameraWindow.close();}catch(e){}
  }
  if(!bridgeRecording){
    cameraWindow=null;
    bridgeReady=false;
    bridgeTest=false;
    pendingBridgeStart=null;
  }
}

function refreshCameras(){
  if(bridgeRecording){
    note('Recording is active. Scan next AWB or press STOP & SAVE.');
    return;
  }
  closeIdleBridge_();
  const w=openBridge('TEST',{});
  if(w) note('Camera bridge opened. Select/verify the webcam there.');
}

function testCamera(){
  if(bridgeRecording){
    note('Recording is active. Scan next AWB or press STOP & SAVE.');
    return;
  }
  closeIdleBridge_();
  const w=openBridge('TEST',{});
  if(!w) return;
  note('Opening live camera test...');
}

function beginBridgeRecording_(r){
  if(!r) return;

  bridgeSession={
    awb:String(r.awb||''),
    orderId:String(r.orderId||''),
    status:String(r.status||''),
    videoType:String(r.videoType||mode||'DISPATCH').toUpperCase(),
    pendingLookup:false
  };
  pendingBridgeStart=null;
  bridgeTest=false;

  rec.style.display='none';
  recTitle.textContent=bridgeSession.videoType==='RETURN' ? 'MAKE RETURN VIDEO' : 'MAKE DISPATCH VIDEO';
  recMeta.innerHTML='<b>Order ID:</b> '+esc(bridgeSession.orderId)+'<br><b>AWB:</b> '+esc(bridgeSession.awb);
  timer.textContent='00:00';

  /*
   * V26 FIX — DO NOT depend on parent -> popup postMessage for START.
   *
   * The practical test proved that the popup could remain in TEST/READY
   * even after the AWB lookup completed.  The reliable trigger is to load
   * the same camera window directly in RECORD+AUTOSTART mode.  No second
   * popup is created: the existing camera window is simply navigated.
   *
   * STOP is still sent by postMessage because the recorder must remain alive
   * until the current video is finalized.
   */
  const url=bridgeUrl_('RECORD',bridgeSession,true);
  if(cameraWindow && !cameraWindow.closed){
    try{
      cameraState.textContent='Camera ready — starting recording...';
      note('AWB verified — starting actual recording now...');
      bridgeNavigating=true;
      cameraWindow.location.replace(url);
      cameraWindow.focus();
    }catch(e){
      note('Unable to start recording in camera window: '+String(e&&e.message||e),true);
      cameraState.textContent='Recording start failed';
    }
  }else{
    const w=openBridge('RECORD',bridgeSession,true);
    if(!w){
      bridgeSession=null;
      return;
    }
    note('Opening camera recording window...');
  }

  if(recordingStartWatchdog)clearTimeout(recordingStartWatchdog);
  const watch=bridgeSession;
  recordingStartWatchdog=setTimeout(function(){
    if(bridgeSession===watch && !bridgeRecording){
      note('RECORD START FAILED — Camera Bridge did not confirm MediaRecorder start.', true);
      cameraState.textContent='Recording start not confirmed';
    }
  },12000);
}
function closeTestBridgeBeforeRecord_(){
  try{
    if(cameraWindow && !cameraWindow.closed && bridgeTest){
      cameraWindow.close();
    }
  }catch(e){}
  cameraWindow=null;
  bridgeReady=false;
  bridgeRecording=false;
  bridgeTest=false;
  pendingBridgeStart=null;
}

function startRecording(r){
  if(!r) return;

  if(bridgeRecording){
    nextOrder=r;
    stopRecording();
    return;
  }

  bridgeSession={
    awb:String(r.awb||''),
    orderId:String(r.orderId||''),
    status:String(r.status||''),
    videoType:String(r.videoType||mode||'DISPATCH').toUpperCase(),
    pendingLookup:false
  };
  pendingBridgeStart=null;
  rec.style.display='none';
  recTitle.textContent=bridgeSession.videoType==='RETURN' ? 'MAKE RETURN VIDEO' : 'MAKE DISPATCH VIDEO';
  recMeta.innerHTML='<b>Order ID:</b> '+esc(bridgeSession.orderId)+'<br><b>AWB:</b> '+esc(bridgeSession.awb);
  timer.textContent='00:00';

  if(cameraWindow&&!cameraWindow.closed){
    beginBridgeRecording_(bridgeSession);
    awb.value='';
    awb.focus();
    return;
  }

  const w=openBridge('RECORD',bridgeSession,true);
  if(!w){
    bridgeSession=null;
    return;
  }
  note('Camera opened — waiting for confirmed recording start...');
  if(recordingStartWatchdog)clearTimeout(recordingStartWatchdog);
  const watch=bridgeSession;
  recordingStartWatchdog=setTimeout(function(){
    if(bridgeSession===watch && !bridgeRecording){
      note('RECORDING START FAILED — camera is live but MediaRecorder did not confirm start.', true);
      cameraState.textContent='Recording start failed';
    }
  },10000);
  awb.value='';
  awb.focus();
}
function sendStopToBridge_(){
  if(!cameraWindow || cameraWindow.closed || !bridgeRecording) return false;
  const msg={source:'DISPATCH_PROOF_PARENT',type:'STOP_RECORDING'};
  /* Retry briefly so a just-reloaded RECORD bridge cannot miss the command. */
  for(let i=0;i<6;i++){
    setTimeout(function(){
      try{
        if(cameraWindow && !cameraWindow.closed && bridgeRecording){
          cameraWindow.postMessage(msg,'*');
        }
      }catch(e){}
    }, i*250);
  }
  return true;
}

function stopRecording(){
  if(sendStopToBridge_()) return;

  if(nextOrder){
    const n=nextOrder;
    nextOrder=null;
    startRecording(n);
  }
}

function stopManual(){
  nextOrder=null;
  if(sendStopToBridge_()){
    note('Stopping camera recording and saving the current video...');
  }else{
    note('No active recording.');
  }
}

function saveRecordingFromBridge(s, blob, fileName){
  if(!s||!blob){
    note('VIDEO SAVE ERROR: camera bridge returned incomplete data.');
    return;
  }

  note('Uploading video for AWB '+s.awb+'...');

  try{
    const file=new File(
      [blob],
      fileName || (s.awb+'_'+s.videoType+'.webm'),
      {type:blob.type||'video/webm'}
    );

    const dt=new DataTransfer();
    dt.items.add(file);

    const input=document.createElement('input');
    input.type='file';
    input.files=dt.files;

    const form=document.createElement('form');
    form.appendChild(input);

    const a=document.createElement('input');
    a.name='awb';
    a.value=s.awb;
    form.appendChild(a);

    const o=document.createElement('input');
    o.name='orderId';
    o.value=s.orderId;
    form.appendChild(o);

    const st=document.createElement('input');
    st.name='status';
    st.value=s.status;
    form.appendChild(st);

    const vt=document.createElement('input');
    vt.name='videoType';
    vt.value=s.videoType;
    form.appendChild(vt);

    google.script.run
      .withSuccessHandler(function(r){
        showNoticeReady(r);
        loadSaved(r);

        /*
         * Preserve V12.3 continuous dispatch workflow:
         * current video saves first, then the next scanned AWB starts.
         */
        if(nextOrder){
          const n=nextOrder;
          nextOrder=null;
          startRecording(n);
        }
      })
      .withFailureHandler(function(e){
        note('VIDEO SAVE ERROR: '+(e&&e.message?e.message:String(e)));
        if(nextOrder){
          const n=nextOrder;
          nextOrder=null;
          startRecording(n);
        }
      })
      .DP21_saveRecording(form);

  }catch(e){
    note('VIDEO SAVE ERROR: '+(e&&e.message?e.message:String(e)));
  }
}

function showNoticeReady(r){note('✓ VIDEO READY • '+r.awb)}
function loadSaved(r){
  const type=r.type;
  google.script.run.withSuccessHandler(v=>{
    if(v&&v.found){
      let buttons='';
      if(type==='RETURN') buttons='<button class=\"primary\" onclick=\"downloadFile('+js(v.fileId)+')\">⬇ DOWNLOAD</button><button class=\"green\" onclick=\"shareFile('+js(v.fileId)+')\">↗ SHARE</button>';
      showCard('<div class=\"grid\"><div><div class=\"label\">ORDER ID</div><div class=\"value\">'+esc(r.orderId)+'</div></div><div><div class=\"label\">AWB</div><div class=\"value\">'+esc(r.awb)+'</div></div><div><div class=\"label\">VIDEO</div><div class=\"value ready\">'+(type==='RETURN'?'RETURN VIDEO READY':'DISPATCH VIDEO READY')+'</div></div><div><div class=\"label\">TYPE</div><div class=\"value\">'+esc(type)+'</div></div></div><div class=\"videoBox\"><video controls playsinline src=\"'+esc(v.downloadUrl)+'\"></video><div class=\"controls\">'+buttons+'</div></div>');
      empty.style.display='none';
    }
  }).DP21_getRecord(r.awb,type)
}
function downloadFile(id){google.script.run.withSuccessHandler(u=>window.open(u,'_blank')).DP21_download(id)}
function shareFile(id){google.script.run.withSuccessHandler(r=>{if(navigator.share)navigator.share({title:'Video Proof',url:r.url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(r.url).then(()=>note('Share link copied.'));else window.prompt('Copy share link:',r.url)}).DP21_share(id)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function js(v){return JSON.stringify(String(v==null?'':v))}
info.textContent='Dispatch: scan AWB → camera opens in READY mode → recording starts automatically after AWB lookup. Next AWB auto-saves the current video and starts the next. STOP & SAVE is the emergency/manual save mode.';cameraState.textContent='Camera bridge not started';awb.focus();
</script></body></html>
